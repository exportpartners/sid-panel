<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Amazon Takip Paneli · Export Partners</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--lac:#232F3E;--tur:#FF7D07;--krem:#F8F5F4;--gri:#6B7280;--cizgi:#E6E8EC;--yes:#2E7D32;--sar:#F0B13C}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins','Segoe UI',Arial,sans-serif;color:#1E1810;background:#fff;font-size:15px;line-height:1.55}
header{background:var(--lac);color:#fff;padding:18px 16px}
.ic{max-width:1000px;margin:0 auto;padding:0 16px}
header .ic{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0}
.logo{font-weight:700;font-size:20px}.logo i{font-style:normal;color:var(--tur)}
.rozet{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:.08em}
h1{font-size:26px;margin:24px 0 2px;color:var(--lac)}
.alt{color:var(--gri);font-size:13px;margin:0 0 18px}
h2{font-size:18px;color:var(--lac);margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--tur)}
.kutular{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kt{background:var(--krem);border:1px solid var(--cizgi);border-left:4px solid var(--tur);border-radius:6px;padding:10px 12px}
.kt .k{font-size:11px;letter-spacing:.08em;color:var(--gri);font-weight:600;text-transform:uppercase}
.kt .v{font-size:24px;font-weight:700;color:var(--lac)}
.adim{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--cizgi)}
.no{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:#C4CBD8}
.adim.tamam .no{background:var(--yes)}.adim.devam .no{background:var(--tur)}
.adim b{color:var(--lac)}.etk{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.tamam .etk{background:#E7F3E8;color:var(--yes)}.devam .etk{background:#FFF1E2;color:#B85600}.bekliyor .etk{background:#EEF0F3;color:var(--gri)}
.adim p{margin:2px 0 0;color:#2E3A49;font-size:13.5px}.tarih{color:var(--gri);font-size:12px}
.tablo{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{background:var(--lac);color:#fff;text-align:left;padding:8px 10px;font-weight:600;font-size:12px}
td{border-bottom:1px solid var(--cizgi);padding:8px 10px}td.s{text-align:right;white-space:nowrap}
tr.top td{font-weight:700;background:var(--krem)}
.not{font-size:12.5px;color:var(--gri);margin-top:6px}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.liste{border:1px solid var(--cizgi);border-radius:10px;padding:12px 14px}
.liste h3{margin:0 0 6px;font-size:14px;color:var(--lac)}.liste ol{margin:0;padding-left:20px;font-size:13.5px}
.dosya a{display:inline-block;background:var(--tur);color:#fff;font-weight:600;border-radius:999px;padding:7px 16px;text-decoration:none;font-size:13px;margin:4px 6px 4px 0}
.strat{border:1px solid var(--cizgi);border-radius:10px;padding:10px 14px;margin:8px 0}.strat b{color:var(--lac)}
footer{margin-top:36px;border-top:1px solid var(--cizgi);padding:14px 0 28px;font-size:12px;color:var(--gri)}
#giris{max-width:360px;margin:12vh auto;padding:0 16px;text-align:center}
#giris input{width:100%;padding:12px;border:1px solid #C4CBD8;border-radius:8px;font:inherit;margin:12px 0}
#giris button{width:100%;padding:12px;border:0;border-radius:999px;background:var(--tur);color:#fff;font:600 15px inherit;cursor:pointer}
#hata{color:#B3261E;font-size:13px;min-height:18px}
.soru textarea{width:100%;min-height:90px;padding:10px;border:1px solid #C4CBD8;border-radius:8px;font:inherit}
.soru button{margin-top:8px;padding:10px 22px;border:0;border-radius:999px;background:var(--tur);color:#fff;font:600 14px 'Poppins',sans-serif;cursor:pointer}
.sc{border:1px solid var(--cizgi);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14px}.sc .z{color:var(--gri);font-size:12px}
.sc .c{margin-top:6px;padding:8px 10px;background:var(--krem);border-radius:8px}.sc .c b{color:var(--lac)}
@media(max-width:640px){.iki{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function coz(sifre){
  const anah=await crypto.subtle.importKey('raw',new TextEncoder().encode(sifre),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VERI.tuz),iterations:VERI.tur,hash:'SHA-256'},anah,{name:'AES-GCM',length:256},false,['decrypt']);
  const acik=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VERI.iv)},key,b64(VERI.veri));
  return JSON.parse(new TextDecoder().decode(acik));
}
const e=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const say=v=>v==null?'—':v;
function ciz(d){
  const ETK={tamam:'Tamamlandı',devam:'Devam ediyor',bekliyor:'Bekliyor'};
  const st=d.stok||{};const api=!!d.api;
  let h=`<h1>${e(d.firma)} · ${e(d.pazar)}</h1><p class="alt">Son güncelleme: ${e(d.guncelleme)}${api?'':' · '+e(d.guncelleme_notu)}</p>`;
  const toplam=k=>d.urunler.reduce((s,u)=>s+((st[u.sku]||{})[k]||0),0);
  h+=`<div class="kutular">
   <div class="kt"><div class="k">Sevkiyattaki ürün</div><div class="v">${d.urunler.reduce((s,u)=>s+(u.gonderilecek||0),0)}</div></div>
   <div class="kt" style="border-left-color:var(--sar)"><div class="k">Yolda / sayılıyor</div><div class="v">${api?toplam('yolda'):'—'}</div></div>
   <div class="kt" style="border-left-color:var(--yes)"><div class="k">Satılabilir</div><div class="v">${api?toplam('satilabilir'):'—'}</div></div>
   <div class="kt" style="border-left-color:var(--lac)"><div class="k">Rezerve</div><div class="v">${api?toplam('rezerve'):'—'}</div></div></div>`;
  h+='<h2>Süreç, adım adım</h2>'+d.adimlar.map((a,i)=>`<div class="adim ${a.durum}"><div class="no">${a.durum==='tamam'?'✓':i+1}</div><div><b>${e(a.ad)}</b><span class="etk">${ETK[a.durum]||''}</span> <span class="tarih">${e(a.tarih)}</span><p>${e(a.aciklama)}</p></div></div>`).join('');
  h+=`<h2>Stok durumu</h2><div class="tablo"><table><tr><th>Ürün</th><th class="s">Sevkiyatta</th><th class="s">Yolda / sayılıyor</th><th class="s">Satılabilir</th><th class="s">Rezerve</th><th class="s">Satılamaz</th></tr>`+
   d.urunler.map(u=>{const s=st[u.sku]||{};return `<tr><td><b>${e(u.sku)}</b>${u.ad!==u.sku?'<br><span class="not">'+e(u.ad)+'</span>':''}</td><td class="s">${say(u.gonderilecek)}</td><td class="s">${api?say(s.yolda):'—'}</td><td class="s">${api?say(s.satilabilir):'—'}</td><td class="s">${api?say(s.rezerve):'—'}</td><td class="s">${api?say(s.satilamaz):'—'}</td></tr>`}).join('')+
   `</table></div><p class="not"><b>Rezerve:</b> satılmış ama henüz gönderilmemiş ya da Amazon'un depolar arası taşıdığı ürünler. <b>Satılamaz:</b> hasarlı ya da kusurlu sayılan ürünler.</p>`;
  h+=`<h2>Sevkiyatlar</h2><div class="tablo"><table><tr><th>Sevkiyat no</th><th class="s">Koli</th><th class="s">Ürün</th><th>Ağırlık</th><th>Çıkış</th><th>Kargo</th><th>Durum</th></tr>`+
   d.sevkiyatlar.map(s=>`<tr><td><b>${e(s.no)}</b></td><td class="s">${e(s.koli)}</td><td class="s">${e(s.adet)}</td><td>${e(s.agirlik)}</td><td>${e(s.cikis)}</td><td>${e(s.kargo)}</td><td>${e(s.durum)}</td></tr>`).join('')+'</table></div>';
  h+=`<h2>Sırada ne var</h2><div class="iki"><div class="liste"><h3>Sizden beklenen</h3><ol>${d.sizden.map(x=>'<li>'+e(x)+'</li>').join('')}</ol></div><div class="liste"><h3>Bizim yapacağımız</h3><ol>${d.bizden.map(x=>'<li>'+e(x)+'</li>').join('')}</ol></div></div>`;
  h+=`<h2>Dosyalar</h2><div class="dosya">${d.dosyalar.map(f=>`<a href="${e(f.link)}" target="_blank" rel="noopener">${e(f.ad)}</a>`).join('')}</div>`;
  h+=`<h2>Strateji</h2>${d.strateji.map(s=>`<div class="strat"><b>${e(s.baslik)}</b><br>${e(s.metin)}</div>`).join('')}`;
  h+=`<h2>Sorularınız</h2><div class="soru"><p class="not" style="margin-top:0">Sorunuzu buraya yazın; günde bir kez yanıtlıyoruz. Yanıt bu bölümde, sorunuzun altında görünür.</p><textarea id="soruMetin" placeholder="Sorunuz"></textarea><br><button id="soruGonder" type="button">Gönder</button> <span id="soruMsg" class="not"></span><div id="soruListe"></div></div>`;
  h+=`<footer>Export Partners LLC · 5835 Callaghan Rd, Ste 204-0501, San Antonio, Texas 78228, USA<br>Barbaros Mah. Mor Sümbül Sk. Nidakule Blok No:7/3F, Ataşehir, İstanbul<br>exportpartners.com.tr · exportpartnersllc.com</footer>`;
  const p=document.getElementById('panel');p.innerHTML=h;p.hidden=false;document.getElementById('giris').hidden=true;
}

const FB='https://export-partners-crm-default-rtdb.europe-west1.firebasedatabase.app/sid_panel_v1/sorular';
let SK=null;
const enc=new TextEncoder(),b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function soruAnahtar(sifre){const a=await crypto.subtle.importKey('raw',enc.encode(sifre),'PBKDF2',false,['deriveKey']);
  SK=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('sid-panel-soru-v1'),iterations:200000,hash:'SHA-256'},a,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function kapat(t){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64e(iv),v:b64e(await crypto.subtle.encrypt({name:'AES-GCM',iv},SK,enc.encode(t)))};}
async function ac(o){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},SK,b64(o.v)))}catch(_){return null}}
async function sorulariCiz(){const el=document.getElementById('soruListe');if(!el)return;
  let d={};try{d=await (await fetch(FB+'.json',{cache:'no-store'})).json()||{}}catch(_){}
  const L=[];for(const [k,x] of Object.entries(d)){const q=x&&x.s?await ac(x.s):null;if(!q)continue;L.push({z:x.zaman||0,q,c:x.c?await ac(x.c):null});}
  L.sort((a,b)=>b.z-a.z);
  el.innerHTML=L.map(x=>`<div class="sc"><div class="z">${new Date(x.z).toLocaleString('tr-TR')}</div>${e(x.q)}${x.c?'<div class="c"><b>Yanıt:</b> '+e(x.c)+'</div>':'<div class="z" style="margin-top:4px">Yanıt bekleniyor</div>'}</div>`).join('');}
function soruBagla(){const b=document.getElementById('soruGonder');if(!b)return;
  b.onclick=async()=>{const t=document.getElementById('soruMetin').value.trim(),m=document.getElementById('soruMsg');if(!t)return;
    b.disabled=true;try{const r=await fetch(FB+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s:await kapat(t),zaman:Date.now()})});
      if(!r.ok)throw 0;document.getElementById('soruMetin').value='';m.textContent='Sorunuz alındı, günde bir kez yanıtlıyoruz.';sorulariCiz();}
    catch(_){m.textContent='Gönderilemedi, lütfen biraz sonra tekrar deneyin.';}b.disabled=false;};
  sorulariCiz();}
async function dene(s){try{const d=await coz(s);await soruAnahtar(s);try{localStorage.setItem('sidp',s)}catch(_){}ciz(d);soruBagla();return true}catch(_){return false}}
document.getElementById('gir').onclick=async()=>{const s=document.getElementById('sifre').value.trim();if(!(await dene(s)))document.getElementById('hata').textContent='Şifre hatalı.';};
document.getElementById('sifre').addEventListener('keydown',ev=>{if(ev.key==='Enter')document.getElementById('gir').click();});
(async()=>{let s=null;try{s=localStorage.getItem('sidp')}catch(_){}if(s)await dene(s);})();
</script>
