<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Amazon Takip Paneli · Export Partners</title>
<style>
:root{--ink:#0E1B3D;--paper:#f4f5f8;--card:#fff;--line:#e3e6ec;--orange:#ff7d07;--text:#1a2238;--muted:#8a90a0;--green:#2E7D4F;--blueL:#cfe3fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:60}
.logo{font-weight:800;font-size:19px;letter-spacing:-.2px}.logo i{font-style:normal;color:var(--orange)}
.htitle{font-size:12px;font-weight:600;color:#cdd6e4;letter-spacing:.5px;border-left:1px solid #2c3d66;padding-left:14px}
.htitle small{display:block;color:#7a86a0;font-size:9.5px;letter-spacing:.6px;margin-top:2px}
.logbtn{margin-left:auto;background:transparent;border:1px solid #3a4a72;color:#cdd6e4;border-radius:8px;padding:6px 12px;font:600 12px inherit;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
.tabs{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.tab{background:#fff;border:2px solid var(--ink);border-radius:11px;padding:9px 18px;font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--ink);cursor:pointer;font-family:inherit}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 2px 6px rgba(14,27,61,.3)}
.ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 1px 4px rgba(14,27,61,.05)}
.kt .k{font-size:10.5px;letter-spacing:.6px;color:var(--muted);font-weight:700;text-transform:uppercase}
.kt .v{font-size:24px;font-weight:800;color:var(--ink)}
.kart{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 1px 4px rgba(14,27,61,.05);overflow:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
thead th{background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;text-align:left;padding:10px;white-space:nowrap}
tbody td{border-top:1px solid var(--line);padding:9px 10px;vertical-align:middle;font-size:13px}
td.s{text-align:right;white-space:nowrap}
.secbar td{background:#f6f8fb;padding:8px 10px}
.secpill{display:inline-flex;gap:8px;align-items:center;background:var(--orange);color:#fff;border-radius:10px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.secpill .n{color:#ffe3c7;font-size:11px}
.secpill.ink{background:var(--ink)}.secpill.gr{background:var(--green)}
.dur{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.dur.tamam{background:#E5F2EA;color:var(--green)}.dur.devam{background:#FFF0E0;color:#B85600}.dur.bekliyor{background:#EEF0F3;color:#5b6475}
.kim{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.acik{color:#4a5468;font-size:12.5px}
.gantt td.g{padding:0;position:relative;height:42px;min-width:480px}
.gbar{position:absolute;top:12px;height:18px;border-radius:6px;background:var(--blueL)}
.gbar.tamam{background:#9fd3b2}.gbar.devam{background:var(--orange)}
.gbar.bekliyor{background:repeating-linear-gradient(45deg,#cfe3fb,#cfe3fb 6px,#e8f1fd 6px,#e8f1fd 12px)}
.gbugun{position:absolute;top:0;bottom:0;width:2px;background:#c0392b}
.not{font-size:12px;color:var(--muted);margin:8px 2px}
.dosya{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.dosya a{background:var(--orange);color:#fff;font-weight:700;border-radius:9px;padding:9px 16px;text-decoration:none;font-size:13px}
.strat{padding:12px 16px;border-top:1px solid var(--line)}.strat:first-child{border-top:0}.strat b{color:var(--ink)}
.soru{padding:14px}
.soru textarea{width:100%;min-height:90px;padding:10px;border:1px solid #c9cfda;border-radius:9px;font:inherit}
.soru button{margin-top:8px;background:var(--orange);color:#fff;border:0;border-radius:9px;padding:9px 18px;font:800 13px inherit;cursor:pointer}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.sc .z{color:var(--muted);font-size:11.5px}
.sc .c{margin-top:6px;padding:8px 10px;background:#f6f8fb;border-radius:8px}
footer{margin-top:24px;font-size:11.5px;color:var(--muted)}
#giris{max-width:360px;margin:12vh auto;padding:0 16px;text-align:center}
#giris h1{color:var(--ink);font-size:22px}
#giris input{width:100%;padding:12px;border:1px solid #c9cfda;border-radius:9px;font:inherit;margin:12px 0}
#giris button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--orange);color:#fff;font:800 15px inherit;cursor:pointer}
#hata{color:#c0392b;font-size:13px;min-height:18px}
[hidden]{display:none!important}
.mob{display:none}
@media(max-width:640px){.htitle{display:none}.tab{padding:8px 12px;font-size:12px}
 .gtab{min-width:0}.gtab thead,.gtab td.kim,.gtab td.tt{display:none}.mob{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ink)}
 .gtab td:first-child{width:96px}
 .gantt{min-width:0}.gantt td.g{min-width:0}.gantt th:first-child,.gantt td:first-child{width:118px!important;font-size:12px}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function coz(sifre){
  const anah=await crypto.subtle.importKey('raw',new TextEncoder().encode(sifre),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VERI.tuz),iterations:VERI.tur,hash:'SHA-256'},anah,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VERI.iv)},key,b64(VERI.veri))));
}
const e=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ETK={tamam:'Tamamlandı',devam:'Devam ediyor',bekliyor:'Bekliyor'};
const AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const gun=s=>new Date(s+'T12:00').getTime();
const tf=s=>{if(!s)return '';const d=new Date(s+'T12:00');return d.getDate()+' '+AY[d.getMonth()]};
function sekme(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===id));
  document.querySelectorAll('section').forEach(s=>s.hidden=s.id!=='s-'+id);try{localStorage.setItem('sidsekme',id)}catch(_){}}
function tarihYaz(a){if(a.durum==='tamam')return e(a.tarih||tf(a.bit));if(!a.bit)return e(a.tarih||'');return tf(a.bit)+'<div class="acik">tahmini</div>';}
function gorevler(d){
  const grup=[['devam','Şu an yapılan','ink'],['bekliyor','Sırada',''],['tamam','Tamamlananlar','gr']];
  let h='<div class="kart"><table class="gtab"><thead><tr><th style="width:120px">Durum</th><th>İş</th><th style="width:140px">Kim yapıyor</th><th style="width:100px">Tarih</th></tr></thead><tbody>';
  for(const [k,ad,c] of grup){const L=d.adimlar.filter(a=>a.durum===k);if(!L.length)continue;
    h+=`<tr class="secbar"><td colspan="4"><span class="secpill ${c}">${ad} <span class="n">${L.length}</span></span></td></tr>`;
    h+=L.map(a=>`<tr><td><span class="dur ${a.durum}">${ETK[a.durum]}</span></td><td><b>${e(a.ad)}</b><div class="acik">${e(a.aciklama)}</div><div class="mob">${e(a.kim||'')}${a.bit||a.tarih?' · '+(a.durum==='tamam'?e(a.tarih||tf(a.bit)):(a.bit?tf(a.bit)+' (tahmini)':e(a.tarih))):''}</div></td><td class="kim">${e(a.kim||'')}</td><td class="tt">${tarihYaz(a)}</td></tr>`).join('');}
  return h+'</tbody></table></div>';
}
function cizelge(d){
  const L=d.adimlar.filter(a=>a.bas&&a.bit);if(!L.length)return '<p class="not">Zaman çizelgesi henüz yok.</p>';
  const acik=L.filter(a=>a.durum!=='tamam');   // eski tamamlanmis isler cizelgeyi gereksiz genisletmesin, solda kirpilir
  let a0=Math.min(...(acik.length?acik:L).map(a=>gun(a.bas)))-4*864e5,a1=Math.max(...L.map(a=>gun(a.bit)))+3*864e5;
  const W=a1-a0,yuz=t=>((t-a0)/W*100),bug=Date.now();
  let ust='';for(let t=new Date(a0);t.getTime()<=a1;t.setDate(t.getDate()+7))ust+=`<span style="position:absolute;left:${yuz(t.getTime()).toFixed(2)}%;top:9px;font-size:10px;color:#cdd6e4">${t.getDate()} ${AY[t.getMonth()]}</span>`;
  let h=`<div class="kart"><table class="gantt"><thead><tr><th style="width:210px">İş</th><th style="position:relative;height:32px">${ust}</th></tr></thead><tbody>`;
  h+=L.map(a=>{const x=Math.max(0,yuz(gun(a.bas))),w=Math.max(1.5,yuz(gun(a.bit)+864e5)-x);
    return `<tr><td><b>${e(a.ad)}</b><div class="acik">${tf(a.bas)}${a.bas!==a.bit?' – '+tf(a.bit):''}${a.durum==='tamam'?'':' · tahmini'}</div></td><td class="g"><div class="gbar ${a.durum}" style="left:${x.toFixed(2)}%;width:${w.toFixed(2)}%"></div>${bug>a0&&bug<a1?`<div class="gbugun" style="left:${yuz(bug).toFixed(2)}%"></div>`:''}</td></tr>`}).join('');
  return h+'</tbody></table></div><p class="not">Kırmızı çizgi bugünü gösterir. Yeşil: tamamlanan, turuncu: devam eden, çizgili: sıradaki işlerin tahmini tarihleri. Kargo, depo kabulü ve sayım süreleri tahminidir; Amazon tarafı ilerledikçe panel kendiliğinden güncellenir.</p>';
}
function stok(d){
  const st=d.stok||{},api=!!d.api,s=k=>d.urunler.reduce((t,u)=>t+((st[u.sku]||{})[k]||0),0),v=x=>api?(x==null?'—':x):'—';
  let h=`<div class="ozet"><div class="kt"><div class="k">Sevkiyattaki ürün</div><div class="v">${d.urunler.reduce((t,u)=>t+(u.gonderilecek||0),0)}</div></div>
  <div class="kt"><div class="k">Yolda / sayılıyor</div><div class="v">${v(s('yolda'))}</div></div>
  <div class="kt"><div class="k">Satılabilir</div><div class="v">${v(s('satilabilir'))}</div></div>

   d.urunler.map(u=>{const x=st[u.sku]||{};return `<tr><td><b>${e(u.sku)}</b></td><td>${e(u.fnsku||'')}</td><td class="s">${e(u.gonderilecek)}</td><td class="s">${v(x.yolda)}</td><td class="s">${v(x.satilabilir)}</td><td class="s">${v(x.rezerve)}</td><td class="s">${v(x.satilamaz)}</td></tr>`}).join('')+'</tbody></table></div>';
  h+=`<p class="not"><b>Yolda / sayılıyor:</b> Amazon'un sevkiyat kaydındaki adet; koli UPS'e verilmeden de burada görünür. <b>Rezerve:</b> satılmış ama henüz gönderilmemiş ürünler. <b>Satılamaz:</b> hasarlı ya da kusurlu sayılan ürünler.</p>`;
  h+=`<div class="kart" style="margin-top:12px"><table><thead><tr><th>Sevkiyat no</th><th class="s">Koli</th><th class="s">Ürün</th><th>Ağırlık</th><th>Çıkış</th><th>Varış deposu</th><th>Kargo takip</th><th>Durum</th></tr></thead><tbody>`+
   d.sevkiyatlar.map(x=>`<tr><td><b>${e(x.no)}</b></td><td class="s">${e(x.koli)}</td><td class="s">${e(x.adet)}</td><td>${e(x.agirlik)}</td><td>${e(x.cikis)}</td><td>${e(x.depo||'')}</td><td>${e(x.takip||x.kargo)}</td><td>${e(x.durum)}</td></tr>`).join('')+'</tbody></table></div>';

  h+=`<p class="not" style="margin-top:0">Son güncelleme: ${e(d.guncelleme)} · ${tam} iş tamamlandı, ${dev} iş sırada${d.api?' · Amazon verisi bağlı':' · '+e(d.guncelleme_notu)}</p>`;
  h+=`<section id="s-gorev">${gorevler(d)}</section><section id="s-zaman">${cizelge(d)}</section><section id="s-stok">${stok(d)}</section>`;
  h+=`<section id="s-belge"><div class="kart"><div class="dosya">${d.dosyalar.map(f=>`<a href="${e(f.link)}" target="_blank" rel="noopener">${e(f.ad)}</a>`).join('')}</div></div></section>`;
  if(d.listing){const L=d.listing;h+=`<section id="s-list"><div class="kart"><div class="strat"><b>${e(L.durum)}</b><br>${e(L.not||'')}</div>${L.urunler.map(u=>`<div class="strat"><b>${e(u.sku)} · ${e(u.ayak)}</b> <span style="color:#6b7280">(${e(u.asin)})</span><br><span style="color:#b45309">Şu anki sorun:</span> ${e(u.sorun)}<br><br><b>Önerilen başlık</b><br>${e(u.baslik)}<br><br><b>Önerilen maddeler</b><ol style="margin:6px 0 0 18px;padding:0">${u.maddeler.map(m=>`<li style="margin-bottom:4px">${e(m)}</li>`).join('')}</ol><b>Arama terimleri (arka plan)</b><br><span style="font-family:monospace;font-size:13px">${e(u.arama)}</span></div>`).join('')}${(L.gorsel||[]).length?`<div class="strat"><b>Görseller</b><ul style="margin:6px 0 0 18px;padding:0">${L.gorsel.map(g=>`<li style="margin-bottom:4px">${e(g)}</li>`).join('')}</ul></div>`:''}<div class="strat"><b>A+ içerik ve marka hikayesi</b><br>${e(L.aplus)}</div>${(d.sizden||[]).length?`<div class="strat"><b>Sizden beklenenler</b><ol style="margin:6px 0 0 18px;padding:0">${d.sizden.map(s=>`<li>${e(s)}</li>`).join('')}</ol></div>`:''}${(d.bizden||[]).length?`<div class="strat"><b>Export Partners'ın yapacakları</b><ol style="margin:6px 0 0 18px;padding:0">${d.bizden.map(s=>`<li>${e(s)}</li>`).join('')}</ol></div>`:''}</div></section>`;}
  h+=`<section id="s-strat"><div class="kart">${d.strateji.map(s=>`<div class="strat"><b>${e(s.baslik)}</b><br>${e(s.metin)}</div>`).join('')}</div></section>`;
  h+=`<section id="s-soru"><div class="kart soru"><p class="not" style="margin-top:0">Sorunuzu buraya yazın; günde bir kez yanıtlıyoruz. Yanıt bu bölümde, sorunuzun altında görünür.</p><textarea id="soruMetin" placeholder="Sorunuz"></textarea><br><button id="soruGonder" type="button">Gönder</button> <span id="soruMsg" class="not"></span><div id="soruListe"></div></div></section>`;
  h+=`<footer>Export Partners LLC · 5835 Callaghan Rd, Ste 204-0501, San Antonio, Texas 78228, USA · Barbaros Mah. Mor Sümbül Sk. Nidakule Blok No:7/3F, Ataşehir, İstanbul · exportpartners.com.tr · exportpartnersllc.com</footer>`;
  const p=document.getElementById('panel');p.innerHTML=h;p.hidden=false;document.getElementById('giris').hidden=true;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>sekme(t.dataset.t));
  let s='gorev';try{s=localStorage.getItem('sidsekme')||'gorev'}catch(_){}sekme(s);
}
const FB='https://export-partners-crm-default-rtdb.europe-west1.firebasedatabase.app/sid_panel_v1/sorular';
let SK=null;
const enc=new TextEncoder(),b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function soruAnahtar(sifre){const a=await crypto.subtle.importKey('raw',enc.encode(sifre),'PBKDF2',false,['deriveKey']);
  SK=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('sid-panel-soru-v1'),iterations:200000,hash:'SHA-256'},a,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function kapat(t){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64e(iv),v:b64e(await crypto.subtle.encrypt({name:'AES-GCM',iv},SK,enc.encode(t)))};}
async function ac(o){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},SK,b64(o.v)))}catch(_){return null}}
async function sorulariCiz(){const el=document.getElementById('soruListe');if(!el)return;
  let d={};try{d=await (await fetch(FB+'.json',{cache:'no-store'})).json()||{}}catch(_){}
  const L=[];for(const [k,x] of Object.entries(d)){const q=x&&x.s?await ac(x.s):null;if(!q)continue;L.push({z:x.zaman||0,q,c:x.c?await ac(x.c):null});}
  L.sort((a,b)=>b.z-a.z);
  el.innerHTML=L.map(x=>`<div class="sc"><div class="z">${new Date(x.z).toLocaleString('tr-TR')}</div>${e(x.q)}${x.c?'<div class="c"><b>Yanıt:</b> '+e(x.c)+'</div>':'<div class="z" style="margin-top:4px">Yanıt bekleniyor</div>'}</div>`).join('');}
function soruBagla(){const b=document.getElementById('soruGonder');if(!b)return;
  b.onclick=async()=>{const t=document.getElementById('soruMetin').value.trim(),m=document.getElementById('soruMsg');if(!t)return;
    b.disabled=true;try{const r=await fetch(FB+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s:await kapat(t),zaman:Date.now()})});
      if(!r.ok)throw 0;document.getElementById('soruMetin').value='';m.textContent='Sorunuz alındı, günde bir kez yanıtlıyoruz.';sorulariCiz();}
    catch(_){m.textContent='Gönderilemedi, lütfen biraz sonra tekrar deneyin.';}b.disabled=false;};
  sorulariCiz();}
async function dene(s){try{const d=await coz(s);await soruAnahtar(s);try{localStorage.setItem('sidp',s)}catch(_){}ciz(d);soruBagla();return true}catch(_){return false}}
document.getElementById('gir').onclick=async()=>{const s=document.getElementById('sifre').value.trim();if(!(await dene(s)))document.getElementById('hata').textContent='Şifre hatalı.';};
document.getElementById('sifre').addEventListener('keydown',ev=>{if(ev.key==='Enter')document.getElementById('gir').click();});
(async()=>{let s=null;try{s=localStorage.getItem('sidp')}catch(_){}if(s)await dene(s);})();
</script>
