<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Seller Central Eğitim Seti · Export Partners</title>
<style>
:root{--ink:#232F3E;--paper:#f4f5f8;--line:#e3e6ec;--orange:#FF7D07;--text:#1a2238;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--text);font-size:15px;line-height:1.55}
header{background:var(--ink);color:#fff;padding:14px 16px;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:10}
.ust{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}.logo i{font-style:normal;color:var(--orange)}
.alt{font-size:12px;color:#c4cbd8}
#ara{flex:1 1 260px;min-width:0;border:0;border-radius:999px;padding:10px 16px;font-size:15px;outline:none}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 260px;gap:24px}
nav{order:2}main{order:1;min-width:0}
nav h4{margin:6px 10px 6px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
nav{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:#FFF1E4;color:#B45309}
nav a.bos{color:#a1a7b3}
nav b{display:inline-block;min-width:22px;color:var(--orange)}
.bolum,.adim{scroll-margin-top:96px}
.bolum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.bolum h2{margin:0 0 4px;font-size:21px}.bolum h2 b{color:var(--orange);margin-right:6px}
.ozet{color:var(--muted);margin:0 0 12px}
.adim{border-top:1px solid var(--line);padding:14px 0}
.adim h3{margin:0 0 6px;font-size:16px}
.adim h3 span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:8px}
.adim p{margin:0 0 8px}
.adim img{width:100%;border:1px solid var(--line);border-radius:10px;display:block;margin:6px 0}
.ipucu{background:#FFF7F0;border-left:3px solid var(--orange);padding:8px 12px;border-radius:6px;font-size:14px;margin:6px 0}
.yakinda{color:var(--muted);font-style:italic}
mark{background:#FFE3CC;padding:0 2px;border-radius:3px}
#sonuc{display:none}
.sonuc a{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;color:var(--text);text-decoration:none}
.sonuc small{color:var(--muted);display:block}
footer{max-width:1100px;margin:0 auto;padding:10px 16px 30px;color:var(--muted);font-size:12px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;order:0}}
</style>
</head>
<body>
<header><div class="ust"><div><div class="logo">Export<i>Partners</i></div><div class="alt">Seller Central Eğitim Seti · Stoneiron Defense</div></div>
<input id="ara" type="search" placeholder="Ara: stok, sevkiyat, fiyat, reklam, itiraz..." autocomplete="off"></div></header>
<div id="sonuc" style="max-width:1100px;margin:0 auto;padding:16px 16px 0"></div><div class="wrap"><nav id="menu"></nav><main><div id="icerik"></div></main></div>
<footer>Export Partners LLC · exportpartnersllc.com · Güncelleme: 18.11.2026</footer>
<script>
var V={"baslik": "Amazon Seller Central Eğitim Seti", "musteri": "Stoneiron Defense", "not": "Her adım hesabın kendi ekranından çekilip doğrulanır; doğrulanmayan adım yayına girmez (dogrulandi: false).", "bolumler": [{"id": "giris", "no": 1, "baslik": "Giriş ve ana sayfa", "ozet": "Seller Central'a giriş, iki adımlı doğrulama, ana sayfa ve menü.", "adimlar": []}, {"id": "stok", "no": 2, "baslik": "Stok durumu", "ozet": "Ürünlerin kaç adedi satışta, kaçı yolda, kaçı Amazon depoları arasında aktarımda; nereden bakılır.", "adimlar": []}, {"id": "sevkiyat", "no": 3, "baslik": "Sevkiyat takibi", "ozet": "Gönderinin Amazon'a teslimi, sayım, depolar arası aktarım ve envanter kayıt raporu (Inventory Ledger).", "adimlar": [{"baslik": "Gönderiler sayfasını açın", "dogrulandi": true, "gorsel": "fba-gonderiler.jpg", "anahtar": "manage shipments gonderi listesi shipment", "metin": ["Seller Central'da üstteki arama kutusuna <b>Shipments</b> yazın ve çıkan <b>Manage Shipments</b> sayfasını açın.", "Amazon'a gönderdiğiniz bütün koliler bu listede durur. Her satır bir gönderidir."]}, {"baslik": "Durum sütununu okuyun", "dogrulandi": true, "gorsel": "fba-gonderiler.jpg", "anahtar": "status delivered closed receiving durum", "metin": ["<b>Status</b> sütunu gönderinin nerede olduğunu söyler:", "<b>Delivered</b>: koli Amazon deposuna ulaştı.<br><b>Receiving</b>: Amazon ürünleri sayıyor.<br><b>Closed</b>: sayım bitti, ürünler stoğa geçti."], "ipucu": "<b>Destination</b> sütunundaki kod (örnek HIA1), kolinin ilk gittiği Amazon deposudur."}, {"baslik": "Gönderinin ayrıntısını açın", "dogrulandi": true, "gorsel": "fba-gonderiler.jpg", "anahtar": "view details ayrinti", "metin": ["Satırın sağındaki <b>View details</b> düğmesine basın.", "Açılan sayfada kaç adedin teslim alındığı ve kargo takip numarası görünür."]}, {"baslik": "Teslim alındı ama satışta değil: depolar arası aktarım", "dogrulandi": true, "anahtar": "fc transfer aktarim reserved satilabilir 0 neden satista degil", "metin": ["Amazon, ilk depoya gelen ürünleri kendi depoları arasında dağıtır. Bu sürede ürünler hesabınızda görünür ama satılamaz.", "Bu aktarım Amazon'un kontrolündedir; satıcının hızlandırması mümkün değildir. Genelde 1-2 hafta sürer."], "ipucu": "Ürünlerin hangi depodan hangi depoya geçtiği, Export Partners'ın hazırladığı sevkiyat durum raporunda tarihleriyle yazar."}]}, {"id": "yeni-sevkiyat", "no": 4, "baslik": "Yeni sevkiyat oluşturma", "ozet": "Send to Amazon ile yeni gönderi, koli etiketi, kargo.", "adimlar": [{"baslik": "Send to Amazon'u başlatın", "dogrulandi": true, "gorsel": "fba-adim1.jpg", "anahtar": "send to amazon yeni gonderi baslat", "metin": ["Manage Shipments sayfasının sağ üstündeki <b>Send to Amazon</b> düğmesine basın.", "Açılan sayfada <b>Step 1: Choose inventory to send</b> yazar."]}, {"baslik": "Gönderilecek ürünleri ve adetleri seçin", "dogrulandi": true, "gorsel": "fba-adim1.jpg", "anahtar": "step 1 sku adet ship from", "metin": ["<b>Ship from</b> kısmında kolinin çıkacağı adres yazar; doğru olduğunu kontrol edin.", "<b>Marketplace destination</b> kutusunda <b>United States</b> seçili olmalı.", "Listeden göndereceğiniz ürünleri ve adetleri girin."]}, {"baslik": "Kargo şirketini seçin", "dogrulandi": true, "gorsel": "fba-kargo.jpg", "anahtar": "step 2 kargo ups partnered carrier spd", "metin": ["<b>Step 2</b> adımında yöntem <b>Small parcel delivery (SPD)</b>, yani koli gönderimi olur.", "<b>UPS (Amazon partnered carrier)</b> kutusunu seçin. Fiyat kutunun içinde yazar ve Amazon hesabınızdan düşülür."], "ipucu": "UPS'i seçince kargo takip numarası Amazon'a kendiliğinden bağlanır; ayrıca girmenize gerek kalmaz."}, {"baslik": "Koli etiketini yazdırın", "dogrulandi": true, "gorsel": "fba-etiket.jpg", "anahtar": "step 3 etiket print box label", "metin": ["<b>Print box and shipping labels</b> kısmında kağıt boyutunu seçip <b>Print</b>'e basın.", "Çıkan etiketi kolinin üstüne yapıştırın. Durum <b>Ready to ship</b> olur."]}, {"baslik": "Ürün barkodu", "dogrulandi": true, "gorsel": "fba-fnsku-etiket.jpg", "anahtar": "fnsku barkod urun etiketi", "metin": ["Her ürünün üstünde Amazon'un verdiği barkod (X00 ile başlar) bulunur. Kolideki eski barkodlar kapatılır."]}, {"baslik": "Koliyi UPS'e teslim edin", "dogrulandi": true, "gorsel": "fba-adimlar.jpg", "anahtar": "teslim ups tracking son adim", "metin": ["Koliyi en yakın UPS noktasına bırakın ve teslim fişinin fotoğrafını Export Partners'a iletin.", "Bütün adımlar tamamlanınca sayfada beş adımın yanında onay işareti görünür."]}]}, {"id": "ilan", "no": 5, "baslik": "Ürün ilanları ve fiyat", "ozet": "İlanı bulma, fiyat değiştirme, başlık ve görsel düzenleme, ilan uyarıları.", "adimlar": []}, {"id": "siparis", "no": 6, "baslik": "Siparişler ve iadeler", "ozet": "Gelen siparişleri görme, iade talepleri.", "adimlar": []}, {"id": "reklam", "no": 7, "baslik": "Reklam (Campaign Manager)", "ozet": "Kampanyaları görme, bütçe, reklam raporu.", "adimlar": []}, {"id": "hesap-sagligi", "no": 8, "baslik": "Hesap sağlığı ve itiraz", "ozet": "Account Health, politika uyarıları, kaldırılan ilana itiraz.", "adimlar": []}, {"id": "marka", "no": 9, "baslik": "Marka, A+ içerik ve yorumlar", "ozet": "Brand Registry, A+ içerik, Vine ve müşteri yorumları.", "adimlar": []}, {"id": "odeme", "no": 10, "baslik": "Ödemeler", "ozet": "Amazon'un hesabınıza yatıracağı tutar, ödeme dönemi, kesintiler.", "adimlar": []}, {"id": "destek", "no": 11, "baslik": "Amazon destek kaydı (case)", "ozet": "Amazon'a destek kaydı açma ve takip.", "adimlar": []}, {"id": "uygulama", "no": 12, "baslik": "Amazon Seller uygulaması", "ozet": "Telefondan stok, sipariş ve barkod okutma.", "adimlar": []}, {"id": "sss", "no": 13, "baslik": "Sık sorulan sorular", "ozet": "Stok ne zaman satışa açılır, satılabilir 0 ne demek, ve benzerleri.", "adimlar": []}]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c")}
var menu="<h4>BÖLÜMLER</h4>",ic="",idx=[];
V.bolumler.forEach(function(b){
 var hazir=b.adimlar.length>0;
 menu+='<a href="#'+b.id+'" class="'+(hazir?"":"bos")+'"><b>'+b.no+'</b>'+esc(b.baslik)+'</a>';
 ic+='<section class="bolum" id="'+b.id+'"><h2><b>'+b.no+'</b>'+esc(b.baslik)+'</h2><p class="ozet">'+esc(b.ozet)+'</p>';
 if(!hazir) ic+='<p class="yakinda">Bu bölüm hazırlanıyor.</p>';
 var onceki=null;
 b.adimlar.forEach(function(a,i){
  var aid=b.id+"-"+(i+1), gor=(a.gorsel&&a.gorsel!==onceki)?a.gorsel:null; onceki=a.gorsel||onceki;
  ic+='<div class="adim" id="'+aid+'"><h3><span>'+(i+1)+'</span>'+esc(a.baslik)+'</h3>'+(a.metin||[]).map(function(p){return"<p>"+p+"</p>"}).join("")+
   (gor?'<img loading="lazy" src="img/'+gor+'" alt="'+esc(a.baslik)+'">':"")+(a.ipucu?'<div class="ipucu">'+a.ipucu+'</div>':"")+'</div>';
  idx.push({id:aid,b:b.baslik,t:a.baslik,m:norm(b.baslik+" "+a.baslik+" "+(a.metin||[]).join(" ")+" "+(a.ipucu||"")+" "+(a.anahtar||"")).replace(/<[^>]+>/g," ")});
 });
 if(!hazir) idx.push({id:b.id,b:b.baslik,t:b.ozet,m:norm(b.baslik+" "+b.ozet)});
 ic+='</section>';
});
document.getElementById("menu").innerHTML=menu;document.getElementById("icerik").innerHTML=ic;
var ara=document.getElementById("ara"),son=document.getElementById("sonuc");
ara.addEventListener("input",function(){
 var q=norm(ara.value.trim());
 if(q.length<2){son.style.display="none";return}
 var k=q.split(/\s+/),r=idx.filter(function(x){return k.every(function(w){return x.m.indexOf(w)>=0})});
 son.style.display="block";
 son.innerHTML='<div class="bolum sonuc"><h2>'+r.length+' sonuç</h2>'+(r.length?r.map(function(x){return'<a href="#'+x.id+'"><small>'+esc(x.b)+'</small>'+esc(x.t)+'</a>'}).join(""):'<p class="ozet">Sonuç yok. Başka bir kelime deneyin.</p>')+'</div>';
});
son.addEventListener("click",function(e){if(e.target.closest("a")){son.style.display="none";ara.value=""}});
var bl=[].slice.call(document.querySelectorAll(".bolum[id]")),ml=[].slice.call(document.querySelectorAll("#menu a"));
window.addEventListener("scroll",function(){var y=window.scrollY+120,akt=null;bl.forEach(function(s){if(s.offsetTop<=y)akt=s.id});
 ml.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+akt)})});
</script>
</body>
</html>
