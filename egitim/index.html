erilen bütün koliler bu listede durur; her satır bir gönderidir.", "anahtar": "manage shipments gonderi listesi shipment", "dogrulandi": true}, {"baslik": "Satırı okuyun", "metin": ["<b>Status</b> (durum) (1) gönderinin nerede olduğunu söyler: <b>Receiving</b> Amazon ürünleri sayıyor, <b>Closed</b> sayım bitti.", "<b>Destination</b> (varış deposu) (2) kolinin ilk gittiği Amazon deposunun kodudur.", "Sağdaki sütunun (3) üst satırı <b>Prime eligible</b> (Prime'a uygun adet), alt satırı <b>On-hand</b> (depoya girmiş adet). Teslim alınan adet için alt satıra bakın."], "gorsel": "sev2-2-durum.jpg", "anahtar": "status receiving closed destination durum teslim alinan adet", "dogrulandi": true}, {"baslik": "Gönderinin ayrıntısını açın", "metin": ["Satırın sağındaki <b>View details</b>'e (ayrıntıyı gör) basın (1). Açılan sayfada adetler ve kargo takip numarası görünür."], "gorsel": "sev2-3-detay.jpg", "anahtar": "view details ayrinti", "dogrulandi": true}, {"baslik": "Teslim alındı ama satışta değil: depolar arası aktarım", "metin": ["Amazon ilk depoya gelen ürünleri kendi depoları arasında dağıtır. Bu sürede stok ekranında <b>FC transfer</b> görünür ve bu adetler satılabilir stoğa (<b>Available</b>) sayılmaz.", "Bu aktarımı ve süresini Amazon belirler; birkaç gün ile birkaç hafta arasında değişebilir."], "ipucu": "Ayrıntı için Stok durumu bölümüne bakın.", "anahtar": "fc transfer aktarim neden satista degil satilabilir 0", "dogrulandi": true}], "grup": "B", "grupAd": "Ürün ve sevkiyat"}, {"id": "global", "baslik": "Başka ülkelerde satış (kısa not)", "ozet": "Ürün ABD'de satılıyor; başka ülke şu an gündemde değil.", "adimlar": [{"baslik": "Başka ülke ayarı", "metin": ["Ürün düzenleme sayfasındaki <b>Offer</b> bölümünde <b>Sell In Other Marketplaces</b> (başka pazarlarda sat) ayarı ve ülke satırları bulunur. Başka bir ülkede satış gündeme gelirse önce WhatsApp grubundan Export Partners'a yazabilirsiniz.", "Kullanıcı yetkileri ekranında Kanada ya da Brezilya için görünen <b>Verify identity</b> (kimliği doğrula) uyarısı ABD'deki satış ve reklam için gerekmez."], "dogrulandi": true, "anahtar": "global kanada meksika verify identity başka ülke", "gorsel": "global-1.jpg"}], "no": "B5", "grup": "B", "grupAd": "Ürün ve sevkiyat"}, {"id": "reklam-baslangic", "baslik": "Reklama nereden başlanır: 5 adımda okuma sırası", "ozet": "Reklam bölümleri bu sırayla okunursa konu adım adım oturur.", "adimlar": [{"baslik": "1. Reklam nedir, nerede görünür", "metin": ["Önce <b>C1</b> ve <b>C2</b>: reklamın ne olduğu ve alıcının onu nerede gördüğü.", "Ekranda: <b>Sponsored Products</b> sekmesi (1) ve Amazon'un çiziminde arama sonucunda <b>Sponsored</b> etiketiyle görünen ürün (2)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-tur-sp.jpg"}, {"baslik": "2. Nasıl çalışır ve türleri", "metin": ["<b>C3</b> ve <b>C4</b>: teklif, bütçe ve üç reklam türü."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-tur-sb.jpg"}, {"baslik": "3. Panele giriş ve kampanya kurulumu", "metin": ["<b>C5</b> ve <b>C6</b>: reklam paneline giriş ve kampanya kurulumunun her ekranı.", "Ekranda: <b>Ads console</b> düğmesi (1) ve kısayol çubuğundaki bağlantı (2)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-sc-ads.jpg"}, {"baslik": "4. Ayarlar: hedefleme, teklif, bütçe", "metin": ["<b>C7</b> ile <b>C10</b>: otomatik ve manuel reklam, eşleşme türleri, teklif ve bütçe.", "Ekranda: önerilen teklif ve aralığı (1) ile girilen teklif (2)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-onerilen-teklif.jpg"}, {"baslik": "5. Ölçüm ve günlük kontrol", "metin": ["<b>C11</b> ile sonrası: ekrandaki sayılar, arama terimi raporu, negatif kelime, ödeme, duraklatma ve \"reklam neden görünmüyor\" kontrol listesi."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-sutunlar.jpg"}], "grup": "C", "grupAd": "Reklam", "no": "C0"}, {"id": "reklam-nedir", "baslik": "Amazon reklamı nedir, neden verilir?", "ozet": "Hiç bilmeyen için: reklamın ne olduğu, kime göründüğü, nasıl ücretlendirildiği.", "adimlar": [{"baslik": "Amazon reklamı nedir?", "metin": ["Amazon'da bir müşteri arama kutusuna bir şey yazdığında çıkan sonuçların bir kısmı reklamdır; üzerinde <b>Sponsored</b> (sponsorlu) yazar. Satıcı, ürününün bu yerlerde görünmesi için Amazon'a ücret öder.", "Ekranda: <b>Sponsored Products</b> sekmesi (1) ve Amazon'un çiziminde arama sonucunda <b>Sponsored</b> etiketiyle görünen ürün (2)."], "dogrulandi": true, "anahtar": "amazon reklamı nedir sponsored", "gorsel": "rk-tur-sp.jpg"}, {"baslik": "Ücret ne zaman ödenir?", "metin": ["En yaygın reklam türü olan <b>Sponsored Products</b>'ta ücret, reklam gösterildiğinde değil, müşteri reklama <b>tıkladığında</b> ödenir. Bu yüzden tıklama başına maliyet (<b>CPC</b>, cost per click) denir. Satıcı, bir tıklama için ödemeye razı olduğu en yüksek tutarı (teklifi) kendisi belirler."], "dogrulandi": true, "anahtar": "tıklama başına ödeme cpc ücret", "kaynak": "https://advertising.amazon.com/solutions/products/sponsored-products", "gorsel": "rk-cpc.jpg"}, {"baslik": "Neden verilir?", "metin": ["Yeni bir ürün, Amazon aramasında kendiliğinden üst sıralara çıkana kadar müşteriler onu az görür. Reklam, ürünün ilgili aramalarda görünmesini sağlar; böylece ilk tıklamalar, ilk satışlar ve ilk yorumlar gelebilir. Reklam satışı garanti etmez; ürünün fiyatı, görselleri ve yorumları da sonucu belirler."], "dogrulandi": true, "anahtar": "neden reklam yeni ürün görünürlük", "gorsel": "rk-gosterim.jpg"}, {"baslik": "Reklamı verilen ürün hangi sayfaya gider?", "metin": ["Müşteri reklama tıkladığında doğrudan ürünün kendi sayfasına (ürün detay sayfası) gider."], "dogrulandi": true, "anahtar": "reklam tıklayınca ürün sayfası", "kaynak": "https://advertising.amazon.com/solutions/products/sponsored-products", "gorsel": "rk-urun-sayfa.jpg"}], "no": "C1", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-nerede", "baslik": "Reklam nerede görünür?", "ozet": "Arama sonuçlarının en üstü, arama sonuçlarının geri kalanı, başka ürünlerin sayfaları.", "adimlar": [{"baslik": "Reklamın çıktığı yerler", "metin": ["<b>Top of search (first page)</b>: arama sonuçlarının ilk sayfasının en üst sırası. Bilgisayarda en üst sıradaki en fazla ilk 5, telefonda en fazla ilk 4 yerdir.", "<b>Rest of search</b>: arama sonuçlarının ortası, altı ve ikinci sayfa ile sonrası.", "<b>Product pages</b>: ürün detay sayfaları ile sepete ekleme sayfası gibi arama sonucu dışındaki yerler.", "<b>Amazon Business placements</b>: işletme alıcılarına açık Amazon Business sayfalarındaki reklam yerleri.", "Ekranda: <b>Bid adjustments</b> sekmesi (1), reklamın çıktığı yerlerin satırları (2) ve yüzde artış kutuları (3)."], "dogrulandi": true, "anahtar": "reklam nerede görünür top of search rest of search product pages", "kaynak": "https://advertising.amazon.com/help/GYYZVM7LGSRYGWV5", "gorsel": "rk-yerlesim.jpg"}, {"baslik": "Hangi yerde ne sonuç alındığı nereden görülür?", "metin": ["Kampanyanın içinde <b>Bid adjustments</b> (teklif ayarları) bölümünde her yerin gösterim, tıklama ve satış sonuçları ayrı ayrı görünür. Ayrıntısı <b>Teklif (bid) nasıl artırılır?</b> bölümünde.", "Ekranda: <b>Bid adjustments</b> sekmesi (1), reklamın çıktığı yerlerin satırları (2) ve yüzde artış kutuları (3)."], "dogrulandi": true, "anahtar": "placement sonuçları yer bazında", "kaynak": "https://advertising.amazon.com/help/GYYZVM7LGSRYGWV5", "gorsel": "rk-yerlesim.jpg"}], "no": "C2", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-nasil", "baslik": "Reklam nasıl çalışır?", "ozet": "Açık artırma, teklif, alaka, günlük bütçe; bir tıklamanın yolculuğu.", "adimlar": [{"baslik": "Açık artırma", "metin": ["Bir müşteri arama yaptığında Amazon hangi reklamı göstereceğine karar verirken teklifi, hedeflenen kelimeyi ve müşterinin ürüne beklenen ilgisini birlikte değerlendirir.", "Ekranda: önerilen teklif ve aralığı (1) ile girilen teklif (2)."], "dogrulandi": true, "anahtar": "açık artırma auction alaka", "kaynak": "https://advertising.amazon.com/help/GTMXQWASBRZTHLF2", "gorsel": "rk-onerilen-teklif.jpg"}, {"baslik": "Ne kadar ödenir?", "metin": ["Teklif, bir tıklama için ödemeye razı olunan en yüksek tutardır. Ödenen tutar, teklif ayarları ve teklif stratejisiyle oluşan en yüksek teklifi geçmez. Gerçekte ödenen tutar tablolarda <b>CPC</b> sütununda görünür."], "dogrulandi": true, "anahtar": "ne kadar ödenir maksimum teklif", "ipucu": "Teklif stratejisi <b>up and down</b> seçiliyse ya da yere göre teklif artışı girildiyse ödenebilecek en yüksek tutar artar (bkz. <b>Teklif nasıl artırılır?</b>).", "kaynak": "https://advertising.amazon.com/help/GTMXQWASBRZTHLF2", "gorsel": "rk-cpc.jpg"}, {"baslik": "Günlük bütçe ne işe yarar?", "metin": ["Kampanyaya bir günlük bütçe verilir. Bu tutar ay boyunca ortalanır: hesabın ayarına göre bir günde günlük bütçenin yüzde 25 ya da yüzde 100 fazlasına kadar harcanabilir, ama ay toplamı günlük bütçe çarpı gün sayısını geçmez. Bütçe biterse reklam o günün geri kalanında gösterilmez; gece yarısı bütçe yenilenince yeniden başlar."], "dogrulandi": true, "anahtar": "günlük bütçe nasıl çalışır", "gorsel": "rk-butce-ayar.jpg", "kaynak": "https://advertising.amazon.com/resources/whats-new/sponsored-ads-daily-budgeting-policy-and-options"}, {"baslik": "Bir tıklamanın yolculuğu (örnek)", "metin": ["<b>1.</b> Müşteri \"red dot mount\" yazar.", "<b>2.</b> Bu kelimeyi hedefleyen reklamlar arasında açık artırma yapılır.", "<b>3.</b> Reklam kazanırsa arama sonuçlarında \"Sponsored\" etiketiyle görünür (bu bir <b>impression</b>, gösterimdir).", "<b>4.</b> Müşteri tıklarsa ücret ödenir (bu bir <b>click</b>, tıklamadır) ve müşteri ürün sayfasına gider.", "<b>5.</b> Müşteri ürünü satın alırsa satış reklama yazılır (bu bir <b>purchase</b>, siparişdir)."], "dogrulandi": true, "anahtar": "tıklama yolculuğu örnek impression click order", "gorsel": "rk-gosterim.jpg"}], "no": "C3", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-turleri", "baslik": "Reklam türleri: Sponsored Products, Brands, Display", "ozet": "Hangi reklam ne işe yarar, hangisi için marka kaydı gerekir.", "adimlar": [{"baslik": "Sponsored Products (ürün reklamı)", "metin": ["Tek bir ürünü arama sonuçlarında ve ürün sayfalarında gösteren, tıklama başına ücretli reklamdır. Yeni satıcının ilk kullandığı reklam türüdür. Reklam verilebilmesi için hesabın profesyonel satıcı hesabı olması, geçerli bir ödeme yöntemi bulunması ve ürünün öne çıkan teklif (Featured Offer) olmaya uygun ve stokta olması gerekir.", "Ekranda: <b>Sponsored Products</b> sekmesi (1) ve Amazon'un çiziminde arama sonucunda <b>Sponsored</b> etiketiyle görünen ürün (2)."], "dogrulandi": true, "anahtar": "sponsored products ürün reklamı şartlar", "kaynak": "https://advertising.amazon.com/help/GMJYF5GN8RNYB6HD", "gorsel": "rk-tur-sp.jpg"}, {"baslik": "Sponsored Brands (marka reklamı)", "metin": ["Markanın logosu, başlığı ve birkaç ürünüyle görünen marka reklamıdır. Yalnızca <b>Amazon Brand Registry</b>'ye (marka kaydı) kayıtlı marka sahibi profesyonel satıcılar açabilir."], "dogrulandi": true, "anahtar": "sponsored brands marka reklamı brand registry şart", "kaynak": "https://advertising.amazon.com/help/G5DAD7ZM3N639QF4", "gorsel": "rk-tur-sb.jpg"}, {"baslik": "Sponsored Display (yeni adı display ads, görüntülü reklam)", "metin": ["Ürünü Amazon içinde ve dışında görüntülü reklam olarak gösteren ayrı bir reklam türüdür. Bu eğitim, ilk aşamada kullanılan <b>Sponsored Products</b> reklamını anlatır.", "Kampanya oluşturma sayfasında <b>DVA+</b> bölümündeki <b>Display</b> sekmesinde yer alır (1)."], "dogrulandi": true, "anahtar": "sponsored display görüntülü reklam", "gorsel": "rk-tur-display.jpg", "kaynak": "https://advertising.amazon.com/solutions/products/sponsored-display"}], "no": "C4", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-giris", "baslik": "Reklam paneline nasıl girilir?", "ozet": "Seller Central'dan reklam paneline (Ads console) geçiş ve panelin düzeni.", "adimlar": [{"baslik": "Reklam panelini açın", "metin": ["Seller Central ana sayfasındaki <b>Ads console</b> (reklam konsolu) düğmesine basın (1). Aynı bağlantı üstteki kısayol çubuğunda da durabilir (2)."], "gorsel": "rk-sc-ads.jpg", "anahtar": "ads console reklam paneli campaign manager giriş", "dogrulandi": true, "ipucu": "Panel açılmıyor ya da \"Register\" (kayıt ol) sayfası geliyorsa kullanıcı yetkisi eksiktir; WhatsApp grubundan Export Partners'a yazabilirsiniz.", "ornek": "Kısayol çubuğu her hesapta farklı olabilir; ana sayfadaki düğme ve menü yolu her hesapta vardır."}, {"baslik": "Menüden açmak", "metin": ["Sol üstteki menü simgesine basın, <b>Marketing</b>'i (pazarlama) açın (1) ve <b>Ads console</b>'a basın (2)."], "gorsel": "rk-sc-menu.jpg", "anahtar": "menu marketing ads console", "dogrulandi": true}, {"baslik": "Kampanya listesini tanıyın", "metin": ["Açılan sayfa <b>Campaigns</b> (kampanyalar) listesidir. Her satır bir kampanyadır; satırda kampanyanın adı (1), durumu (2) ve bütçesi (3) görünür, sağdaki sütunlarda sonuçları yer alır."], "dogrulandi": true, "anahtar": "campaigns kampanya listesi", "gorsel": "rk-liste.jpg"}, {"baslik": "Kampanyanın içine girin", "metin": ["Kampanyanın adına basın. Kampanyanın içindeki <b>Ad groups</b> (reklam grupları) listesi açılır (1); yanındaki sekmelerde teklif ayarları, negatif hedefleme, ayarlar ve değişiklik geçmişi bulunur (2). Kampanya > reklam grubu > reklam sırası şöyledir: kampanya bütçeyi ve teklif stratejisini tutar, reklam grubu ürünleri ve hedeflenen kelimeleri tutar."], "dogrulandi": true, "anahtar": "ad group reklam grubu yapı", "gorsel": "rk-kampanya-sekme.jpg"}, {"baslik": "Reklam grubunun sekmelerini açın", "metin": ["Reklam grubunun adına basın. İçinde <b>Ads</b> (reklamı yapılan ürünler), <b>Targeting</b> (hedeflenen kelimeler ya da ürünler) ve <b>Negative targeting</b> (reklamın görünmeyeceği kelimeler) sekmeleri bulunur (1). <b>Search terms</b> sekmesinde müşterilerin hangi aramalardan reklama tıkladığı görünür (2)."], "dogrulandi": true, "anahtar": "targeting negative targeting ads sekme", "kaynak": "https://advertising.amazon.com/help/GTEHPEG5BXY9UX5W", "gorsel": "rk-adgrup-sekme.jpg"}], "no": "C5", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-kurulum", "baslik": "Kampanya nasıl kurulur, ayarları nedir?", "ozet": "Kampanya > reklam grubu > reklam yapısı ve kurulumdaki her ayar tek tek.", "adimlar": [{"baslik": "Yapı: portföy, kampanya, reklam grubu, reklam", "metin": ["<b>Portfolio</b> (portföy): kampanyaları bir arada toplayan klasördür.", "<b>Campaign</b> (kampanya): bütçe, tarih ve teklif stratejisi burada belirlenir.", "<b>Ad group</b> (reklam grubu): hangi ürünlerin reklamının yapılacağı ve hangi kelimelerin hedefleneceği burada belirlenir.", "<b>Ad</b> (reklam): reklamı yapılan ürünün kendisidir."], "dogrulandi": true, "anahtar": "portföy kampanya reklam grubu yapı", "gorsel": "rk-yapi.jpg"}, {"baslik": "Yeni kampanya başlatın", "metin": ["Kampanya listesinin üstündeki <b>Create campaign</b>'e (kampanya oluştur) basın (1)."], "gorsel": "rk-olustur.jpg", "anahtar": "create campaign kampanya oluştur", "dogrulandi": true, "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER"}, {"baslik": "Sponsored Products'ı seçin", "metin": ["Açılan sayfada <b>Sponsored Products</b> sekmesi seçili olsun (1), altındaki <b>Create campaign</b>'e basın (2)."], "gorsel": "rk-olustur-sp.jpg", "anahtar": "sponsored products create campaign", "dogrulandi": true}, {"baslik": "Ürünü seçin", "metin": ["<b>Products</b> bölümünde ürünü adı, ASIN ya da SKU ile arayın (1) ve <b>Add</b>'e (ekle) basın (2). Stokta olmayan ürünün altında <b>Temporarily out of stock</b> (geçici olarak stokta yok) yazar (3); böyle ürünün reklamı gösterilmez."], "dogrulandi": true, "anahtar": "ürün seçimi stokta aktif", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-urun-sec.jpg"}, {"baslik": "Hedeflemeyi seçin", "metin": ["<b>Automatic targeting</b> (otomatik): Amazon kelimeleri kendisi seçer.", "<b>Manual targeting</b> (manuel): kelimeleri ya da ürünleri siz seçersiniz. Ayrıntısı <b>Otomatik ve manuel reklam farkı nedir?</b> bölümünde.", "Ekranda: otomatik (1) ve manuel (2) hedefleme seçenekleri."], "dogrulandi": true, "anahtar": "automatic manual targeting seçim", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-hedef-sec.jpg"}, {"baslik": "Varsayılan teklifi girin", "metin": ["<b>Default bid</b> (varsayılan teklif): bu reklam grubundaki her hedef için kullanılacak teklif. İstenirse otomatik kampanyada her hedefleme grubuna ayrı teklif de verilebilir (<b>Set bids by targeting group</b>).", "Ekranda: <b>Default bid</b> kutusu (1) ve <b>Set bids by targeting group</b> seçeneği (2)."], "dogrulandi": true, "anahtar": "default bid varsayılan teklif", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-varsayilan-teklif.jpg"}, {"baslik": "Önerilen teklif ne demek?", "metin": ["Teklif kutusunun yanında <b>suggested bid</b> (önerilen teklif) görünür. Amazon bunu, benzer reklamların yakın zamanda kazandığı tekliflerden hesaplar. Büyük alışveriş günleri yaklaşırken ayrıca o döneme ait önerilen teklif ve aralık da gösterilebilir.", "Ekranda: önerilen teklif ve aralığı (1) ile girilen teklif (2)."], "dogrulandi": true, "anahtar": "suggested bid önerilen teklif", "kaynak": "https://advertising.amazon.com/help/GTMXQWASBRZTHLF2", "gorsel": "rk-onerilen-teklif.jpg"}, {"baslik": "Kampanya adı, tarih ve bütçe", "metin": ["<b>Campaign name</b>: kampanyaya sizin anlayacağınız bir ad verilir.", "<b>Start</b> ve <b>End</b> (başlangıç ve bitiş): başlangıç tarihi zorunludur, bitiş tarihi isteğe bağlıdır.", "<b>Daily budget</b>: günlük ortalama bütçe.", "Ekranda: <b>Campaign name</b> (1), <b>Start</b> ve <b>End</b> (2), <b>Daily budget</b> (3)."], "dogrulandi": true, "anahtar": "kampanya adı başlangıç bitiş tarihi daily budget", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-ad-butce.jpg"}, {"baslik": "Teklif stratejisini seçin", "metin": ["Kurulum sayfasındaki <b>Campaign bidding strategy</b> bölümünde üç seçenek vardır: <b>Dynamic bids - up and down</b>, <b>Dynamic bids - down only</b> ve <b>Fixed bids</b> (1). Kurala dayalı teklif (<b>Rule-based bidding</b>) kampanya kurulduktan sonra <b>Settings</b> sekmesinden seçilebilir. Ayrıntısı ve örnekleri <b>Teklif (bid) nasıl artırılır?</b> bölümünde."], "dogrulandi": true, "anahtar": "bidding strategy teklif stratejisi kurulum", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-strateji.jpg"}, {"baslik": "Kampanyayı başlatın", "metin": ["Bütün ayarlar girilince sağ üstteki <b>Launch campaign</b>'e (kampanyayı başlat) basılır (1). Hemen yayına almak istenmiyorsa <b>Save as Draft</b> (taslak olarak kaydet) ile kaydedilebilir (2)."], "dogrulandi": true, "anahtar": "launch campaign başlat", "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "gorsel": "rk-baslat.jpg"}], "no": "C6", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-tur", "baslik": "Otomatik ve manuel reklam farkı nedir?", "ozet": "Otomatik kampanyada Amazon kelimeyi kendisi bulur; manuel kampanyada kelimeleri siz seçersiniz.", "adimlar": [{"baslik": "Otomatik (Auto) kampanya", "metin": ["Otomatik kampanyada kelime girilmez; Amazon ürün sayfasındaki bilgilere bakıp reklamı uygun aramalarda ve ürün sayfalarında kendisi gösterir. Yeni ürünün hangi aramalardan tıklama aldığını öğrenmek için kullanılır."], "dogrulandi": true, "anahtar": "auto otomatik kampanya", "gorsel": "rk-hedef-oto.jpg"}, {"baslik": "Otomatik reklamda dört hedefleme", "metin": ["Otomatik (Auto) kampanyada Amazon reklamı dört yoldan gösterir:", "<b>Close match</b>: ürünle çok yakından ilgili aramalar.<br><b>Loose match</b>: daha geniş, gevşek ilgili aramalar.<br><b>Substitutes</b>: benzer ürünlerin sayfaları.<br><b>Complements</b>: birlikte alınan, tamamlayıcı ürünlerin sayfaları."], "gorsel": "rk-oto-gruplar.jpg", "ipucu": "Her birine ayrı teklif verilebilir. Teklif kararı size aittir; ayrıntı için Export Partners'a yazabilirsiniz.", "anahtar": "auto otomatik close match loose match substitutes complements hedefleme", "dogrulandi": true, "kaynak": "https://advertising.amazon.com/help/GHTRFDZRJPW6764R"}, {"baslik": "Ürün (ASIN) hedefleme", "metin": ["Manuel kampanyada kelime yerine ürün de hedeflenebilir. <b>Individual products</b> (tek tek ürünler): reklam seçilen ürünlerin sayfalarında çıkar.", "<b>Categories</b> (kategoriler): reklam seçilen kategorideki ilgili aramalarda ve sayfalarda çıkar; kategori marka, fiyat aralığı ve yıldız puanına göre daraltılabilir.", "Ekranda: hedeflenen ürünler (1) ve <b>Add product targets</b> (ürün hedefi ekle) düğmesi (2)."], "dogrulandi": true, "anahtar": "ürün hedefleme asin product targeting kategori", "kaynak": "https://advertising.amazon.com/help/GB2JECV9CJK6R6AL", "gorsel": "rk-asin-hedef.jpg"}, {"baslik": "Manuel (Manual) kampanya", "metin": ["Manuel kampanyada hangi kelimede ya da hangi ürünün sayfasında reklamın çıkacağını siz seçersiniz. Otomatik kampanyada satış getiren aramalar genellikle manuel kampanyaya taşınır.", "Ekranda: <b>Manual targeting</b> (1), kelime hedefleme <b>Keyword targeting</b> (2) ve ürün hedefleme <b>Product targeting</b> (3)."], "dogrulandi": true, "anahtar": "manual manuel kampanya kelime hedefleme", "gorsel": "rk-hedef-manuel.jpg"}], "no": "C7", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-eslesme", "baslik": "Geniş, ifade ve tam eşleşme nedir?", "ozet": "Broad, phrase, exact eşleşme türleri ve negatif kelimeler; örneklerle.", "adimlar": [{"baslik": "Manuel reklamda eşleşme türleri", "metin": ["Manuel kampanyada anahtar kelime üç türde girilir:", "<b>Broad</b> (geniş): kelimeler herhangi bir sırada ya da ilgili terimlerle geçerse gösterilir; kelimenin kendisi aramada geçmeyebilir.<br><b>Phrase</b> (ifade): kelime grubu aynı sırada geçerse, önüne ya da arkasına kelime eklense de gösterilir.<br><b>Exact</b> (tam): arama kelimeyle aynıysa (tekil-çoğul gibi küçük farklarla) gösterilir.", "Ekranda: eşleşme türü seçimi <b>Broad</b>, <b>Phrase</b>, <b>Exact</b> (1) ve eklenen kelimenin <b>Match type</b> sütunu (2)."], "gorsel": "rk-eslesme.jpg", "ipucu": null, "anahtar": "broad phrase exact eslesme turleri match type anahtar kelime manuel", "dogrulandi": true, "kaynak": "https://advertising.amazon.com/help/GHTRFDZRJPW6764R"}, {"baslik": "Örnekle eşleşme türleri", "metin": ["Kelime: <b>red dot mount</b>.<br><b>Broad</b> (geniş): \"mount for red dot sight\", \"red dot plate\" gibi ilgili aramalarda da çıkabilir; en çok aramayı yakalar, en az kontrolü verir.<br><b>Phrase</b> (ifade): \"red dot mount\" sırası korunduğu sürece \"best red dot mount pistol\" gibi aramalarda çıkar.<br><b>Exact</b> (tam): yalnızca \"red dot mount\" ya da çok yakın yazımlarında çıkar.", "Ekranda: eşleşme türü seçimi <b>Broad</b>, <b>Phrase</b>, <b>Exact</b> (1) ve eklenen kelimenin <b>Match type</b> sütunu (2)."], "dogrulandi": true, "anahtar": "broad phrase exact örnek geniş eşleşme", "ipucu": "Yeni kelime genellikle geniş eşleşmeyle denenir; satış getiren arama tam eşleşmeyle ayrıca eklenir.", "gorsel": "rk-eslesme.jpg", "kaynak": "https://advertising.amazon.com/help/GHTRFDZRJPW6764R"}, {"baslik": "Negatif anahtar kelime", "metin": ["Reklamın görünmesi istenmeyen aramalar <b>negative keyword</b> olarak eklenir.", "<b>Negative exact</b>: yalnız o arama ya da çok yakın yazımı engellenir.<br><b>Negative phrase</b>: o ifadeyi ya da çok yakın biçimini içeren bütün aramalar engellenir."], "gorsel": "rk-negatif-tur.jpg", "ipucu": "Satış getirmeyen aramalar negatife eklenebilir; sıklığı ve kapsamı birlikte kararlaştırılır.", "anahtar": "negative keyword negatif exact phrase", "dogrulandi": true}, {"baslik": "Negatif kelime nasıl eklenir?", "metin": ["<b>1.</b> Kampanyaya, ardından reklam grubuna girin.", "<b>2.</b> <b>Negative targeting</b> sekmesine basın.", "<b>3.</b> <b>Add negative keywords</b>'e (negatif kelime ekle) basın.", "<b>4.</b> Eşleşme türünü seçin, kelimeyi yazın, <b>Add keywords</b>'e ve ardından <b>Save</b>'e basın.", "Ekranda: eşleşme türü (1), kelime kutusu (2), <b>Add keywords</b> (3) ve <b>Save</b> (4)."], "dogrulandi": true, "anahtar": "negatif kelime ekle add negative keywords", "ipucu": "Negatif ifade en fazla 4, negatif tam en fazla 10 kelime olabilir. Eklenmiş negatifin eşleşme türü sonradan değiştirilemez. Eklenen negatifin etkisi 72 saat içinde başlar.", "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/help/GTEHPEG5BXY9UX5W", "gorsel": "rk-negatif-ekle.jpg"}], "no": "C8", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-teklif", "baslik": "Teklif (bid) nasıl artırılır ya da azaltılır?", "ozet": "Kelime teklifini değiştirme, teklif stratejisi (dynamic bids) ve sayfadaki yere göre teklif artışı; örneklerle.", "adimlar": [{"baslik": "Teklif nedir?", "metin": ["<b>Bid</b> (teklif), bir tıklama için ödenmeye razı olunan en yüksek tutardır. Ödenen tutar açık artırmada belirlenir. Teklif yükseldikçe reklamın gösterilme ihtimali artar, tıklama başı maliyet de artabilir."], "dogrulandi": true, "anahtar": "bid teklif nedir", "gorsel": "rk-teklif.jpg"}, {"baslik": "Kelimenin teklifini değiştirin", "metin": ["<b>1.</b> Kampanyaya, ardından reklam grubuna girin.", "<b>2.</b> <b>Targeting</b> sekmesine basın; her kelime ya da hedef bir satırdır.", "<b>3.</b> Satırdaki <b>Bid</b> kutusuna basın, yeni tutarı yazın ve kaydedin.", "<b>4.</b> Kutunun yanında Amazon'un önerdiği teklif ya da aralık görünebilir; karar verirken fikir verir.", "Ekranda: <b>Bid</b> kutusu (1), önerilen teklif (2) ve önerilen teklifi uygulayan <b>Apply</b> düğmesi (3)."], "dogrulandi": true, "anahtar": "teklif artırma azaltma bid değiştir targeting", "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/help/GTMXQWASBRZTHLF2", "gorsel": "rk-teklif-degis.jpg"}, {"baslik": "Teklif stratejisi: seçenekler", "metin": ["Kampanyanın <b>Settings</b> (ayarlar) sekmesinde <b>Campaign bidding strategy</b> (teklif stratejisi) bölümü bulunur. <b>Rule-based bidding</b> ayrı bir seçenektir (1); diğer üçü <b>Other bidding strategies</b> altındaki listeden seçilir (2):<br><b>Dynamic bids - down only</b> (yalnız düşürme): satış ihtimali düşük görünen yerlerde Amazon teklifi düşürür, hiç yükseltmez.<br><b>Dynamic bids - up and down</b> (artır ve düşür): Amazon teklifi satış ihtimaline göre yüzde 100'e kadar artırır ya da düşürür; 1 dolarlık teklif en fazla 2 dolara çıkabilir.<br><b>Fixed bids</b> (sabit): girilen teklif aynen kullanılır.<br><b>Rule-based bidding</b> (kurala dayalı): belirlenen ROAS hedefine göre Amazon teklifi artırır ya da düşürür; bu seçeneğin kendi uygunluk şartları vardır."], "dogrulandi": true, "anahtar": "dynamic bids down only up and down fixed teklif stratejisi", "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/help/GCU2BUWJH2W3A8Z7", "gorsel": "rk-strateji-ayar.jpg"}, {"baslik": "Sayfadaki yere göre teklif artışı", "metin": ["Kampanya içinde <b>Bid adjustments</b> (teklif ayarları) bölümünde reklamın çıktığı yere göre yüzde artış girilir:<br><b>Top of search (first page)</b>: arama sonuçlarının ilk sayfasının en üst sırası.<br><b>Rest of search</b>: arama sonuçlarının ortası, altı ve sonraki sayfalar.<br><b>Product pages</b>: başka ürünlerin sayfaları ve sepete ekleme sayfası gibi yerler.<br><b>Amazon Business placements</b>: Amazon Business sayfalarındaki yerler.<br>Aynı sekmede her yerin sonuçları (gösterim, tıklama, satış) da görülür.", "Ekranda: <b>Bid adjustments</b> sekmesi (1), reklamın çıktığı yerlerin satırları (2) ve yüzde artış kutuları (3)."], "dogrulandi": true, "anahtar": "placement top of search rest of search product pages bid adjustments", "kaynak": "https://advertising.amazon.com/help/GYYZVM7LGSRYGWV5", "gorsel": "rk-yerlesim.jpg"}, {"baslik": "Örnekle teklif artışı", "metin": ["Kelime teklifi 1 dolar, <b>Top of search</b> artışı yüzde 50 olsun. Reklam en üst sıra için yarışırken teklif 1,50 dolar olur.<br>Aynı kampanyada <b>up and down</b> stratejisi seçiliyse Amazon bu teklifi en fazla 3 dolara kadar çıkarabilir.", "Ekranda: <b>Dynamic bids - up and down</b> seçeneği (1) ve <b>Top of search</b> yüzde kutusu (2)."], "dogrulandi": true, "anahtar": "örnek teklif artışı yüzde 50 top of search", "ipucu": "Artışlar üst üste eklenir; yüksek yüzdeler tıklama başı maliyeti hızla büyütebilir.", "kaynak": "https://advertising.amazon.com/help/GYYZVM7LGSRYGWV5", "gorsel": "rk-yerlesim-ornek.jpg"}], "no": "C9", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-butce", "baslik": "Günlük bütçe nasıl değiştirilir?", "ozet": "Kampanyanın günlük bütçesinin anlamı ve değiştirilmesi.", "adimlar": [{"baslik": "Günlük bütçe nedir?", "metin": ["<b>Daily budget</b> (günlük bütçe), kampanyanın günlük ortalama bütçesidir. Ay boyunca ortalanır; hesabın ayarına göre bir günde bu tutarın yüzde 25 ya da yüzde 100 fazlasına kadar harcanabilir, ama ay toplamı günlük bütçe çarpı gün sayısını geçmez."], "gorsel": "rk-butce.jpg", "anahtar": "daily budget gunluk butce bid teklif dynamic bids down only", "dogrulandi": true, "uyari": "Bütçe ya da teklifi değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayarlar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/resources/whats-new/sponsored-ads-daily-budgeting-policy-and-options"}, {"baslik": "Bütçeyi değiştirin", "metin": ["<b>1.</b> Kampanya listesinde kampanyanın satırındaki <b>Campaign budget amount</b> (bütçe) kutusuna basın (1).", "<b>2.</b> Yeni günlük tutarı yazın ve kaydedin. Aynı alan kampanyanın <b>Settings</b> sekmesinde <b>Budget</b> olarak da bulunur."], "dogrulandi": true, "anahtar": "bütçe değiştir budget daily", "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir.", "kaynak": "https://advertising.amazon.com/help/GKLC3W8HTM6XT9QH", "gorsel": "rk-butce-degis.jpg"}, {"baslik": "Bütçe gün ortasında bitiyorsa", "metin": ["Bütçe bitince kampanyanın durumunda <b>Out of budget</b> (bütçe bitti) görünür; reklam o günün geri kalanında gösterilmez ve gece yarısı yeniden başlar. Bütçeyi artırmadan önce hangi kelimenin harcadığına bakmak daha doğrudur (bkz. <b>Hangi aramadan satış geldi?</b>)."], "dogrulandi": true, "anahtar": "out of budget bütçe bitti", "gorsel": "rk-durum.jpg"}], "no": "C10", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam", "baslik": "Reklam ekranındaki sayılar ne anlatır?", "ozet": "Gösterim, tıklama, tıklama başı maliyet (CPC), ACoS ve diğer sütunlar; sütunların nasıl eklendiği.", "adimlar": [{"baslik": "Reklam ekranındaki sütunlar ne anlatır", "metin": ["<b>Impressions</b>: reklamın kaç kez gösterildiği.<br><b>Clicks</b>: kaç kez tıklandığı.<br><b>CTR</b>: tıklama oranı (tıklama ÷ gösterim).<br><b>CPC</b>: tıklama başına ödenen ortalama tutar.<br><b>Total cost</b> (eski adı Spend): harcama.<br><b>Purchases</b> (eski adı Orders) ve <b>Sales</b>: reklamdan gelen sipariş sayısı ve satış tutarı.<br><b>ACoS</b>: harcamanın satışa oranı (harcama ÷ satış). Kâr için ACoS'un ürünün kâr marjının altında kalması gerekir.<br><b>ROAS</b>: her 1 dolar reklamın getirdiği satış (satış ÷ harcama)."], "gorsel": "rk-sutunlar.jpg", "ipucu": null, "anahtar": "impressions clicks ctr cpc spend acos roas siparis satis gosterim tiklama", "dogrulandi": true}, {"baslik": "Örnekle ACoS ve ROAS", "metin": ["Bir haftada reklama 10 dolar harcandığını, reklamdan 40 dolarlık satış geldiğini düşünün.<br><b>ACoS</b> = 10 ÷ 40 = yüzde 25 (her 100 dolarlık satış için 25 dolar reklam harcanmış).<br><b>ROAS</b> = 40 ÷ 10 = 4 (her 1 dolar reklam 4 dolar satış getirmiş)."], "dogrulandi": true, "anahtar": "acos roas örnek hesap", "gorsel": "rk-ozet.jpg"}, {"baslik": "Örnekle tıklama başı maliyet (CPC)", "metin": ["Reklam 200 kez gösterilmiş (<b>Impressions</b>), 10 kez tıklanmış (<b>Clicks</b>), toplam 6 dolar harcanmış (<b>Cost</b>).<br><b>CTR</b> = 10 ÷ 200 = yüzde 5.<br><b>CPC</b> = 6 ÷ 10 = 0,60 dolar; yani tıklama başına ortalama 60 sent ödenmiş."], "dogrulandi": true, "anahtar": "cpc cost per click tıklama başı maliyet örnek", "gorsel": "rk-ozet.jpg"}, {"baslik": "TACOS ve dönüşüm oranı", "metin": ["<b>TACOS</b> (toplam satışa göre reklam payı): reklam harcamasının, reklamlı ve reklamsız <b>bütün</b> satışlara oranıdır. Örnek: 10 dolar reklam, toplam 100 dolar satış: TACOS yüzde 10.", "<b>Dönüşüm oranı</b> (panelde <b>Purchase rate</b>): sipariş sayısının tıklama sayısına oranıdır. Örnek: 20 tıklamadan 2 sipariş: yüzde 10."], "dogrulandi": true, "anahtar": "tacos dönüşüm oranı conversion rate", "ipucu": "TACOS reklam panelindeki tabloda hazır bir sütun olarak görünmeyebilir; reklam harcaması ve toplam satıştan hesaplanır.", "kaynak": "https://advertising.amazon.com/library/guides/authors-guide-to-sponsored-products", "gorsel": "rk-donusum.jpg"}, {"baslik": "Görmek istediğiniz sütunu ekleyin", "metin": ["Tablonun sağ üstündeki <b>Columns</b>'a (sütunlar) basın, ardından <b>Customize columns</b>'ı (sütunları özelleştir) seçin. Açılan listeden görmek istediğiniz sütunları (örneğin CPC, ACoS, ROAS) işaretleyip kaydedin."], "dogrulandi": true, "anahtar": "customize columns sütun ekle columns cpc acos", "ipucu": "Kampanya, reklam grubu ve hedefleme sayfalarının her birinde aynı düğme vardır.", "kaynak": "https://advertising.amazon.com/help/GKLC3W8HTM6XT9QH", "gorsel": "rk-columns.jpg"}, {"baslik": "Tarih aralığını seçin", "metin": ["Tablonun üstündeki tarih kutusundan dönemi seçin (örneğin <b>Last 7 days</b>, son 7 gün). Bütün sayılar seçilen rt Partners'a da gönderilmez."}, {"baslik": "Sonucu kontrol edin", "metin": ["Kampanya listesinde durum sütununda kampanyaların yeniden yayında görünmesi gerekir (1). Birkaç saat içinde değişmezse WhatsApp grubundan Export Partners'a yazabilirsiniz."], "gorsel": "rk-durum.jpg", "anahtar": "durum status kontrol", "dogrulandi": true}], "grup": "C", "grupAd": "Reklam", "no": "C15"}, {"id": "reklam-duraklat", "baslik": "Kampanya nasıl duraklatılır ve yeniden açılır?", "ozet": "Stok gelene kadar ya da bir sorun çözülene kadar kampanya durdurulabilir; silmeye gerek yoktur.", "adimlar": [{"baslik": "Kampanya listesini açın", "metin": ["Reklam panelinde soldaki kampanyalar simgesine basın (1); <b>Campaigns</b> (kampanyalar) sayfası açılır (2)."], "gorsel": "rk-panel.jpg", "anahtar": "campaigns kampanya listesi", "dogrulandi": true}, {"baslik": "Durum düğmesine basın", "metin": ["Kampanya satırının solundaki <b>Active</b> aç/kapat düğmesine basın (1). Düğme gri olunca kampanya <b>Paused</b> (duraklatıldı) olur (2), harcama durur."], "gorsel": "rk-duraklat.jpg", "anahtar": "paused duraklat aktif düğme", "dogrulandi": true, "uyari": "Değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayar harcamayı doğrudan değiştirir."}, {"baslik": "Yeniden açın", "metin": ["Aynı düğmeye tekrar basınca kampanya yeniden yayına girer; ayarlar ve geçmiş veri korunur. Düğme kampanyanın kendi sayfasında, adının altında da bulunur (1); durum yanında yazar (2)."], "gorsel": "rk-yeniden-ac.jpg", "anahtar": "yeniden aç enable", "dogrulandi": true, "ipucu": "Kampanyayı silmek yerine duraklatmak, geçmiş veriyi korur."}], "grup": "C", "grupAd": "Reklam", "no": "C16"}, {"id": "reklam-butce-bitti", "baslik": "Bütçe biterse ne görülür?", "ozet": "Günlük bütçe biten kampanya o günün geri kalanında durur.", "adimlar": [{"baslik": "Durum: Out of budget", "metin": ["Kampanya listesinde <b>Status</b> (durum) sütununda <b>Out of budget</b> (bütçe bitti) görünür (1); reklam o günün geri kalanında gösterilmez ve gece yarısı bütçe yenilenince yeniden başlar."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-durum.jpg"}, {"baslik": "Ne yapılır", "metin": ["Bütçe her gün erken bitiyorsa <b>Campaign budget amount</b> (bütçe) sütunundaki tutarın artırılması düşünülebilir (1); karar öncesi WhatsApp grubundan Export Partners'a yazabilirsiniz."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-butce.jpg"}], "grup": "C", "grupAd": "Reklam", "no": "C17"}, {"id": "reklam-gorunmuyor", "baslik": "Reklamım neden görünmüyor: kontrol listesi", "ozet": "Reklam yayında görünmüyorsa bu sırayla bakılır.", "adimlar": [{"baslik": "1. Ödeme yöntemi", "metin": ["Ödeme yöntemi geçersizse bütün reklamlar durur. Bkz. <b>Reklam ödeme yöntemi nereden güncellenir?</b>", "Ekranda: <b>Administration</b> (1) ve <b>Billing</b> (2)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-billing.jpg"}, {"baslik": "2. Ürün satın alınabilir mi", "metin": ["Ürün öne çıkan teklif (Featured Offer, satın al kutusu) değilse ya da stokta yoksa reklam gösterilmez. İlan bastırılmışsa da reklam çıkmaz. Stok ve ilan durumu için <b>Stokum ne durumda?</b> bölümüne bakın.", "Ekranda: ürün arama kutusu (1), <b>Add</b> düğmesi (2) ve <b>Temporarily out of stock</b> yazısı (3)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-urun-sec.jpg"}, {"baslik": "3. Bütçe bitti mi", "metin": ["Kampanya durumunda <b>Out of budget</b> (bütçe bitti) yazıyorsa reklam o gün için durmuştur."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-durum.jpg"}, {"baslik": "4. Teklif düşük mü", "metin": ["Teklif, önerilen teklifin çok altındaysa reklam çok az gösterilebilir. Teklifi değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz.", "Ekranda: önerilen teklif ve aralığı (1) ile girilen teklif (2)."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-onerilen-teklif.jpg"}, {"baslik": "5. Kampanya ve reklam grubu açık mı", "metin": ["Reklam grubu listesinde <b>Active</b> düğmesi açık olmalı (1) ve <b>Status</b> (durum) sütununda <b>Paused</b> (duraklatıldı) yazmamalı (2). Aynı kontrol kampanya listesinde ve reklam grubunun <b>Ads</b> sekmesinde de yapılır."], "anahtar": "", "dogrulandi": true, "gorsel": "rk-adgrup-acik.jpg"}], "grup": "C", "grupAd": "Reklam", "no": "C18"}, {"id": "reklam-hatalar", "baslik": "Reklamda sık yapılan hatalar", "ozet": "Reklamın boşa para harcamasına ya da hiç gösterilmemesine yol açan durumlar.", "adimlar": [{"baslik": "Stok yokken reklam", "metin": ["Amazon'un kuralına göre ürün öne çıkan teklif (Featured Offer, satın al kutusu) değilse ya da stokta yoksa reklam gösterilmez. Ancak Seller Central'da satılabilir stok 0 görünürken de reklam harcaması olabilir. Bu yüzden satılabilir stok 0'a düştüğünde reklam panelinde harcama (<b>Total cost</b>) sütununa bakılır; gerekirse kampanya duraklatılır. Stok gelmeden bütçeyi artırmak sonuç vermez.", "Ekranda: ürün arama kutusu (1), <b>Add</b> düğmesi (2) ve <b>Temporarily out of stock</b> yazısı (3)."], "dogrulandi": true, "anahtar": "stok yok reklam gösterilmiyor", "kaynak": "https://advertising.amazon.com/help/GKLSYGFS2YD33FER", "gorsel": "rk-urun-sec.jpg", "ipucu": "Bu hesapta: Bu hesapta stok depolar arası aktarımdayken (satılabilir 0) 8-17 Kasım 2026'da 12,63 USD reklam harcaması oldu."}, {"baslik": "Ödeme yöntemi hatası", "metin": ["Reklam hesabında geçerli bir ödeme yöntemi olmalıdır (kredi kartı ya da satıcı hesabı bakiyesinden kesme). Kart reddedilirse ya da süresi dolarsa kampanyalar açık görünse bile reklam yayına çıkmaz.", "Ekranda: <b>Administration</b> (1) ve <b>Billing</b> (2)."], "dogrulandi": true, "anahtar": "ödeme yöntemi hatası payment failure", "kaynak": "https://advertising.amazon.com/library/news/update-on-advertiser-payments", "gorsel": "rk-billing.jpg"}, {"baslik": "Tek kelimelik geniş eşleşme", "metin": ["\"mount\" gibi tek kelimelik bir hedef geniş eşleşmeyle girilirse reklam, ürünle ilgisi zayıf çok sayıda aramada çıkabilir ve tıklama başına harcama artar. Kelime, ürünü anlatan birkaç kelimelik ifadelerle seçilir.", "Ekranda: eşleşme türü seçimi <b>Broad</b>, <b>Phrase</b>, <b>Exact</b> (1) ve eklenen kelimenin <b>Match type</b> sütunu (2)."], "dogrulandi": true, "anahtar": "tek kelime geniş eşleşme hata", "gorsel": "rk-eslesme.jpg"}, {"baslik": "Negatifsiz otomatik kampanya", "metin": ["Otomatik kampanya kendi başına bırakılırsa ilgisiz aramalarda da tıklama alabilir. Arama terimi raporu düzenli okunup ilgisiz aramalar negatif kelime olarak eklenir (bkz. <b>Hangi aramadan satış geldi?</b>).", "Ekranda: reklam grubunun <b>Search terms</b> sekmesi (1) ve müşterilerin yazdığı aramalar (2)."], "dogrulandi": true, "anahtar": "negatif yok otomatik kampanya hata", "gorsel": "rk-arama-sekme.jpg"}, {"baslik": "Sık sık değiştirmek", "metin": ["Teklif ve bütçe her gün değiştirilirse hangi değişikliğin sonucu etkilediği anlaşılmaz. Amazon da değişiklikleri sınırlı tutmayı ve teklifleri yaklaşık iki haftada bir gözden geçirmeyi önerir.", "Kampanyada yapılan her değişiklik, kampanyanın <b>History</b> (geçmiş) sekmesinde tarihiyle görünür (1)."], "dogrulandi": true, "anahtar": "sık değişiklik iki hafta", "kaynak": "https://advertising.amazon.com/library/guides/dynamic-bidding-sponsored-products", "gorsel": "rk-gecmis.jpg"}], "no": "C19", "grup": "C", "grupAd": "Reklam"}, {"id": "reklam-sozluk", "baslik": "Reklam sözlüğü", "ozet": "Reklam ekranındaki terimlerin tek cümlelik anlamları.", "adimlar": [{"baslik": "Terimler", "metin": ["<b>Impression</b>: reklamın bir kez gösterilmesi.", "<b>Click</b>: reklama bir kez tıklanması.", "<b>CTR</b>: tıklama ÷ gösterim.", "<b>CPC</b>: tıklama başına ortalama ödenen tutar.", "<b>Total cost</b> (eski adı Spend): toplam reklam harcaması.", "<b>Sales</b>: reklamdan gelen satış tutarı.", "<b>Purchases</b> (eski adı Orders): reklamdan gelen sipariş sayısı.", "<b>ACoS</b>: harcama ÷ reklam satışı.", "<b>ROAS</b>: reklam satışı ÷ harcama.", "<b>TACOS</b>: harcama ÷ toplam satış.", "<b>Bid</b>: tıklama için verilen en yüksek teklif.", "<b>Default bid</b>: reklam grubunun varsayılan teklifi.", "<b>Daily budget</b>: kampanyanın günlük ortalama bütçesi; hesabın ayarına göre bir günde yüzde 25 ya da yüzde 100'e kadar aşılabilir.", "<b>Keyword</b>: hedeflenen arama kelimesi.", "<b>Match type</b>: eşleşme türü (Broad, Phrase, Exact).", "<b>Negative keyword</b>: reklamın çıkmayacağı arama.", "<b>Search term</b>: müşterinin gerçekten yazdığı arama.", "<b>Placement</b>: reklamın çıktığı yer.", "<b>Portfolio</b>: kampanyaları toplayan klasör.", "<b>ASIN</b>: Amazon'un her ürüne verdiği, harf ve rakamdan oluşan 10 karakterlik kod."], "dogrulandi": true, "anahtar": "sözlük terimler impression click ctr cpc acos roas tacos", "gorsel": "rk-sutunlar.jpg"}], "no": "C20", "grup": "C", "grupAd": "Reklam"}, {"id": "aplus", "baslik": "Marka ve A+ içerik nasıl hazırlanır?", "ozet": "Ürün sayfasının alt kısmındaki görselli marka içeriği (A+), marka kaydı (Brand Registry), Vine ve müşteri yorumları.", "adimlar": [{"baslik": "A+ içerik listesini açın", "metin": ["Üst menüde <b>A+ Content Manager</b>'a basın (1)."], "gorsel": "aplus-1-liste.jpg", "anahtar": "a+ content manager", "dogrulandi": true}, {"baslik": "İçeriğin durumunu okuyun", "metin": ["<b>Content status</b> (içerik durumu) sütununda (2): <b>Draft</b> henüz gönderilmedi, <b>Submitted</b> incelemede, <b>Approved</b> onaylandı ve ürün sayfasında yayında, <b>Rejected</b> reddedildi."], "gorsel": "aplus-1-liste.jpg", "anahtar": "approved submitted rejected durum", "dogrulandi": true}, {"baslik": "Yeni A+ içerik başlatın", "metin": ["Sağ üstteki <b>Start creating A+ content</b>'e basın (3)."], "gorsel": "aplus-1-liste.jpg", "anahtar": "start creating a+ content yeni", "dogrulandi": true}, {"baslik": "İçerik türünü seçin", "metin": ["<b>Basic</b> (1): en fazla 5 modül. Modül, sayfadaki bir görsel ve yazı bloğudur.<br><b>Premium</b> (2): en fazla 7 modül, video ve büyük görsel.<br><b>Brand Story</b> (3): markanın hikayesi, logosu, marka görseli ve açıklaması; ürün açıklamasının üstünde ya da altında görünür."], "gorsel": "aplus-2-tur.jpg", "anahtar": "basic premium brand story modul tur", "uyari": "Yayındaki A+ içeriği değiştirmeden ya da yenisini göndermeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz.", "dogrulandi": true}], "no": "D1", "grup": "D", "grupAd": "Marka ve rapor"}, {"id": "brand-analytics", "baslik": "Brand Analytics: müşteriler ne arıyor?", "ozet": "Amazon'da hangi kelimelerin arandığını ve kimin tıklandığını gösteren marka raporları.", "adimlar": [], "no": "D2", "grup": "D", "grupAd": "Marka ve rapor"}, {"id": "odeme", "no": "D3", "baslik": "Ödemeler ve vergi belgeleri nerede?", "ozet": "Amazon'un hesabınıza yatıracağı tutar, gelir raporu ve şirket vergi belgelerini indirme.", "adimlar": [], "grup": "D", "grupAd": "Marka ve rapor"}, {"id": "sss", "no": "E1", "baslik": "Sık sorulan sorular", "ozet": "Stok, sevkiyat, iade, ödeme, yorum, kullanıcı ve güvenlik hakkında sık sorulan sorular.", "adimlar": [{"baslik": "Ürün Amazon'a ulaştı ama satılabilir stok 0 görünüyor", "dogrulandi": true, "metin": ["Amazon ilk depoya gelen ürünleri kendi depoları arasında dağıtır; bu sürede adetler <b>FC transfer</b> olarak görünür ve <b>Available</b> (satılabilir) sütununa sayılmaz. Amazon'a göre depolar arasında taşınan adetler yine de satın alınabilir. Ayrıntı <b>Stok durumu</b> bölümünde."], "anahtar": "satılabilir 0 fc transfer available stok", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G200740930"}, {"baslik": "Reklam açık ama gösterilmiyor", "dogrulandi": true, "metin": ["Ürün öne çıkan teklif (Featured Offer) değilse ya da stokta yoksa reklam gösterilmez; ödeme yöntemi geçersizse de reklam yayına çıkmaz. Ödeme yöntemi reklam panelinde güncellenir. Emin olunamadığında WhatsApp grubundan Export Partners'a yazabilirsiniz."], "anahtar": "reklam gösterilmiyor ödeme yöntemi payment kampanya"}, {"baslik": "İlan kaldırıldı ya da uyarı geldi", "dogrulandi": true, "metin": ["Gerekçe <b>Account Health</b> (hesap sağlığı) sayfasında yazar; ayrıntı <b>Hesap sağlığı ve itiraz</b> bölümünde. İtiraz göndermeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz."], "anahtar": "ilan kaldırıldı itiraz appeal uyarı"}, {"baslik": "Fiyatı kendim değiştirebilir miyim?", "dogrulandi": true, "metin": ["Fiyat <b>Offer</b> adımından değişir (bkz. <b>Yeni ürün ekleme</b>). Reklam teklifleri ve bütçe fiyata göre ayarlandığı için önce WhatsApp grubundan Export Partners'a yazabilirsiniz."], "anahtar": "fiyat değiştirme price offer"}, {"baslik": "Reserved (ayrılmış) stok ne demek?", "dogrulandi": true, "metin": ["Ayrılmış adetler şu sebeplerden biriyle satılabilir sayıya girmez:", "<b>Customer order</b>: müşteri siparişi verdi, ürün kargoya çıkana kadar ayrılır.", "<b>Staging</b>: Amazon teslimatı hızlandırmak için adetleri geçici olarak bekletir; sizin bir şey yapmanız gerekmez.", "<b>FC processing</b>: depo ürünü ölçü, ağırlık ya da başka bir kontrol için ayırmış.", "Depolar arasında taşınan adetler (<b>FC transfer</b>) ayrılmış sayılmaz; ayrı gösterilir ve satın alınabilir."], "anahtar": "reserved ayrılmış stok fc processing fc transfer customer order", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G201723860", "ipucu": "Bu süreçte ilan kapatılmaz ya da silinmez; adetler satılabilir stoğa dönünce ilan aramada yeniden görünür."}, {"baslik": "Ürünüm aramada çıkmıyor", "dogrulandi": true, "metin": ["<b>Products > Manage products</b> sayfasında <b>Fix</b> sekmesini açın. <b>Listing status</b> sütunu ilanın neden kapalı ya da aramada gizli (search suppressed) olduğunu ve ne yapılacağını yazar.", "Stokun tamamı ayrılmış durumdaysa da ilan aramada geçici olarak görünmeyebilir; bkz. <b>Reserved stok</b> sorusu."], "anahtar": "aramada çıkmıyor search suppressed fix listing status gizli ilan", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/GNYWHX2TP7C8GXHK", "ipucu": "Düzeltme ilan metnini ya da görselini değiştiriyorsa önce WhatsApp grubundan Export Partners'a yazabilirsiniz."}, {"baslik": "Müşteriden yorum nasıl istenir?", "dogrulandi": true, "metin": ["<b>Orders > Manage orders</b> sayfasında siparişi açın ve <b>Request a Review</b> düğmesine basın. Amazon müşteriye kendi şablonuyla e-posta gönderir.", "Her sipariş için bir kez, teslimattan 5 ile 30 gün arasında istenebilir."], "anahtar": "yorum review request a review değerlendirme", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G698QJEQJZFEXSAT", "ipucu": "Yorum karşılığında para, hediye kartı, indirim, geri ödeme ya da ücretsiz ürün teklif edilmez; Amazon'un kuralları buna izin vermez."}, {"baslik": "Müşteri mesajına ne kadar sürede cevap verilmeli?", "dogrulandi": true, "metin": ["Amazon müşteri mesajlarına <b>24 saat içinde</b> cevap bekler; hafta sonu ve tatil günleri de buna dahildir.", "Mesajlar üst şeritteki zarf simgesinden (<b>Messages</b>) açılır."], "anahtar": "müşteri mesajı cevap 24 saat buyer seller messages", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/202152030"}, {"baslik": "Satış parası ne zaman hesaba geçer?", "dogrulandi": true, "metin": ["Amazon satış tutarını teslimattan sonra bir süre bekletir; standart süre <b>teslimat tarihi + 7 gün</b>dür (DD+7). Bekleyen tutar <b>Payments</b> sayfasında <b>Deferred transactions</b> satırında görünür.", "Kullanılabilir bakiye düzenli aralıklarla banka hesabına aktarılır; Payments sayfasındaki ödeme talep düğmesiyle (<b>Request Payout</b> / <b>Disburse Now</b>) 24 saatte bir talep de edilebilir (Disburse on Demand)."], "anahtar": "ödeme para hesaba geçer payment disbursement deferred dd+7", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/202124090", "ipucu": "Payments sayfası yalnız yetki verilmiş kullanıcıda açılır; Export Partners kullanıcısında bu yetki yok.", "kaynak2": "https://sellercentral.amazon.com/help/hub/reference/external/GSCWUZNYQRY4LEZH"}, {"baslik": "Depoda bekleyen stok için ücret var mı?", "dogrulandi": true, "metin": ["Evet. Amazon depoda kapladığı yer için her ay <b>monthly inventory storage fee</b> alır. 181 gün ve daha uzun bekleyen stoğa ayrıca <b>aged inventory surcharge</b> eklenir.", "1 Şubat 2027'den itibaren bu iki ücret, stok yaşı arttıkça yükselen tek bir aylık depolama ücretinde birleşiyor.", "Yaşlanan stok <b>Inventory > Manage Amazon inventory</b> sayfasında izlenir."], "anahtar": "depolama ücreti storage fee aged inventory surcharge uzun süre bekleyen stok", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/GJQNPA23YWVA4SBD", "ipucu": "Satmayan stok için yeni sevkiyat yapmadan önce WhatsApp grubundan Export Partners'a yazabilirsiniz.", "kaynak2": "https://sellercentral.amazon.com/help/hub/reference/external/G3EDYEF6KUCFQTNM"}, {"baslik": "Yeni sevkiyatı ne zaman göndermeliyim?", "dogrulandi": true, "metin": ["<b>Inventory > Manage Amazon inventory</b> sayfasında <b>Inventory health</b> sütunu her ürün için önerilen asgari seviyeyi (<b>Rec. min. level</b>) ve kaç adedin hangi tarihe kadar gönderilmesi önerildiğini yazar (örnek: <b>Ship 3 units by</b> tarih).", "Öneri zorunlu değildir; satış hızına ve kargo süresine göre hesaplanır."], "anahtar": "yeni sevkiyat restock stok bitiyor ne zaman göndermeli inventory health", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G201634550", "ipucu": "Sevkiyat planı Export Partners ile birlikte yapılır; önce WhatsApp grubundan yazabilirsiniz."}, {"baslik": "Müşteri ürünü iade ederse ne olur?", "dogrulandi": true, "metin": ["Amazon deposundan gönderilen üründe iadeyi Amazon teslim alır ve inceler. Ürün satılabilir durumdaysa stoğa geri döner.", "Hasar Amazon'dan ya da kargodan kaynaklanıyorsa Amazon geri ödeme yapar; müşteri kaynaklı hasarlı ürün <b>unfulfillable</b> (satılamaz) stoğa geçer.", "Bu iadeler <b>FBA Customer Returns</b> raporunda görünür. <b>Orders > Manage returns</b> sayfası yalnız satıcının kendi gönderdiği siparişlerin iadelerini gösterir; Amazon deposundan giden ürünlerin iadesi orada çıkmaz."], "anahtar": "iade return müşteri iade etti geri ödeme reimbursement", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/200453320"}, {"baslik": "Satılamaz (unfulfillable) stok ne olur?", "dogrulandi": true, "metin": ["<b>Inventory > Manage Amazon inventory</b> sayfasında <b>Manage unfulfillable inventory</b> sekmesini açın. Ürünleri seçip <b>Create removal order</b> ile size geri gönderilmesini ya da imha edilmesini isteyebilirsiniz.", "Bu ürünler kendiliğinden geri gönderilsin ya da imha edilsin diye otomatik kaldırma ayarı da yapılabilir."], "anahtar": "satılamaz stok unfulfillable removal order imha geri gönderim", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G201436560", "ipucu": "Geri gönderim adresi ve maliyeti için önce WhatsApp grubundan Export Partners'a yazabilirsiniz."}, {"baslik": "Hesaba başka bir kullanıcı nasıl eklenir ya da çıkarılır?", "dogrulandi": true, "metin": ["Sağ üstteki dişli simgesinden <b>Account &amp; notifications > Manage permissions</b> sayfasını açın.", "Yeni kullanıcı e-posta adresiyle davet edilir. Mevcut kullanıcının yetkisi <b>Edit</b> ile değiştirilir; kullanıcı yanındaki açılır menüden <b>Remove user</b> ile çıkarılır."], "anahtar": "kullanıcı ekleme çıkarma yetki permissions user", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G901", "ipucu": "Hesapta kimlerin yetkisi olduğunu ara ara kontrol etmeniz iyi olur; artık çalışmayan kişinin erişimi kaldırılabilir."}, {"baslik": "Amazon'dan geldiği söylenen bir e-posta gerçek mi?", "dogrulandi": true, "metin": ["Amazon e-postayla şifre, banka hesabı ya da kart bilgisi istemez.", "Gerçek Amazon e-postaları <b>@amazon.com</b> ile biten adresten ya da Amazon'un listelediği adreslerden (<b>amazonsellerservices.com</b>, <b>sell.amazon.com</b> gibi) gelir. Gerçek Amazon siteleri <b>.amazon.com</b>, <b>amazonsellerservices.com</b> ya da <b>sellercentral.amazon.com</b> ile biter. Şüpheli e-postadaki bağlantıya tıklamayın; tarayıcıya sellercentral.amazon.com yazıp bildirimi hesabın içinden kontrol edin."], "anahtar": "sahte e-posta phishing dolandırıcılık şifre", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/G32261", "ipucu": "Emin olamadığınız e-postayı WhatsApp grubundan Export Partners'a iletebilirsiniz."}, {"baslik": "Satış raporlarını nereden görürüm?", "dogrulandi": true, "metin": ["<b>Products > Business reports</b> sayfası satışları, sayfa ziyaretlerini (sessions) ve dönüşüm oranını tarihe ve ürüne göre gösterir.", "Ana sayfadaki <b>Sales</b> kutusundaki <b>Business reports</b> bağlantısı da aynı sayfayı açar."], "anahtar": "satış raporu business reports sessions dönüşüm", "kaynak": "https://sellercentral.amazon.com/help/hub/reference/external/202142060"}], "grup": "E", "grupAd": "Sorular"}]};

V.bolumler.forEach(function(b){
 var hazir=b.adimlar.length>0;
 if(b.grup&&b.grup!==sonGrup){menu+=(sonGrup?"</div>":"")+'<h4 data-g="'+b.grup+'"><span>'+esc(b.grup+" · "+(b.grupAd||""))+'</span><i>▾</i></h4><div class="grup" data-g="'+b.grup+'">';sonGrup=b.grup}
 menu+='<a href="#'+b.id+'" class="'+(hazir?"":"bos")+'"><b>'+b.no+'</b>'+esc(b.baslik)+(hazir?'':'<span class="etiket">hazırlanıyor</span>')+'</a>';
 ic+='<section class="bolum" id="'+b.id+'"><h2><small>'+(b.grupAd?esc(b.grupAd).toLocaleUpperCase("tr")+' · ':'')+'BÖLÜM '+b.no+'</small>'+esc(b.baslik)+'</h2><p class="ozet">'+esc(b.ozet)+'</p>'+(b.giris?'<p class="ipucu">'+esc(b.giris)+'</p>':'');
 if(!hazir) ic+='<p class="yakinda">Bu bölüm hazırlanıyor.</p>';
 var onceki=null;
 b.adimlar.forEach(function(a,i){
  var aid=b.id+"-"+(i+1), gor=(a.gorsel&&a.gorsel!==onceki)?a.gorsel:null; onceki=a.gorsel||onceki;
  ic+='<div class="adim" id="'+aid+'"><h3><span>'+(i+1)+'</span>'+esc(a.baslik)+'</h3>'+(a.uyari?'<div class="uyari">'+esc(a.uyari)+'</div>':'')+(a.metin||[]).map(function(p){return"<p>"+p+"</p>"}).join("")+
   (a.gorsel&&!gor?'<div class="ornek">İşaretler yukarıdaki görselde.</div>':'')+(gor?'<img loading="lazy" src="img/'+gor+'" alt="'+esc(a.baslik)+'">'+(a.ornek?'<div class="ornek">'+esc(a.ornek)+'</div>':''):"")+(a.ipucu?'<div class="ipucu">'+a.ipucu+'</div>':"")+'</div>';
  idx.push({id:aid,b:b.baslik,t:a.baslik,m:norm(b.baslik+" "+a.baslik+" "+(a.metin||[]).join(" ")+" "+(a.ipucu||"")+" "+(a.anahtar||"")).replace(/<[^>]+>/g," ")});
 });
 if(!hazir) idx.push({id:b.id,b:b.baslik,t:b.ozet,m:norm(b.baslik+" "+b.ozet)});
 ic+='__GECIS_'+b.id+'__</section>';
});
V.bolumler.forEach(function(b,i){var o=V.bolumler[i-1],n=V.bolumler[i+1],g='<div class="gecis">'+(o?'<a href="#'+o.id+'"><small>← ÖNCEKİ</small>'+o.no+' '+esc(o.baslik)+'</a>':'<span style="flex:1"></span>')+(n?'<a class="sonra" href="#'+n.id+'"><small>SONRAKİ →</small>'+n.no+' '+esc(n.baslik)+'</a>':'<span style="flex:1"></span>')+'</div>';ic=ic.replace('__GECIS_'+b.id+'__',g)});
document.getElementById("menu").innerHTML=menu+(sonGrup?"</div>":"")+'<div class="menu-alt">▼ Menüyü aşağı kaydırın</div>';document.getElementById("icerik").innerHTML=ic;
var ara=document.getElementById("ara"),son=document.getElementById("sonuc");
ara.addEventListener("input",function(){
 var q=norm(ara.value.trim());
 if(q.length<2){son.style.display="none";return}
 var k=q.split(/\s+/),r=idx.filter(function(x){return k.every(function(w){return x.m.indexOf(w)>=0})});
 son.style.display="block";
 son.innerHTML='<div class="bolum sonuc"><h2>'+r.length+' sonuç</h2>'+(r.length?r.map(function(x){return'<a href="#'+x.id+'"><small>'+esc(x.b)+'</small>'+esc(x.t)+'</a>'}).join(""):'<p class="ozet">Sonuç yok. Başka bir kelime deneyin.</p>')+'</div>';
});
son.addEventListener("click",function(e){if(e.target.closest("a")){son.style.display="none";ara.value=""}});
var bl=[].slice.call(document.querySelectorAll(".bolum[id]")),ml=[].slice.call(document.querySelectorAll("#menu a"));
var hd=document.querySelector("header"),sN=document.getElementById("seritNo"),sA=document.getElementById("seritAd");
function ustAyar(){document.documentElement.style.setProperty("--ust",(hd.offsetHeight+10)+"px")}ustAyar();window.addEventListener("resize",ustAyar);
var elle={};document.getElementById("menu").addEventListener("click",function(e){var h=e.target.closest("h4");if(!h)return;var g=h.getAttribute("data-g"),k=!h.classList.contains("kapali");elle[g]=k;h.classList.toggle("kapali",k);document.querySelector('#menu .grup[data-g="'+g+'"]').classList.toggle("kapali",k)});
function goster(){var h=decodeURIComponent(location.hash.slice(1)),el=h?document.getElementById(h):null,sec=el?(el.classList.contains("bolum")?el:el.closest(".bolum")):null;
 if(!sec)sec=bl[0];
 bl.forEach(function(s){s.classList.toggle("gizli",s!==sec)});
 ml.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+sec.id)});
 var b=V.bolumler.filter(function(x){return x.id===sec.id})[0];
 var akg=b?b.grup:null;if(akg)delete elle[akg];[].forEach.call(document.querySelectorAll("#menu h4"),function(h){var g=h.getAttribute("data-g"),k=elle.hasOwnProperty(g)?elle[g]:(g!==akg);h.classList.toggle("kapali",k);document.querySelector('#menu .grup[data-g="'+g+'"]').classList.toggle("kapali",k)});
 var on=document.querySelector("#menu a.on"),nv=document.getElementById("menu");if(on&&nv.scrollHeight>nv.clientHeight)nv.scrollTop=on.offsetTop-nv.clientHeight/2;
 if(b){sN.textContent="BÖLÜM "+b.no+" · BURADASINIZ";sA.textContent=b.baslik}
 if(el&&el!==sec){el.scrollIntoView()}else{window.scrollTo(0,0)}}
window.addEventListener("hashchange",goster);goster();
var nvm=document.getElementById("menu");function sonda(){nvm.classList.toggle("sonda",nvm.scrollTop+nvm.clientHeight>=nvm.scrollHeight-4)}nvm.addEventListener("scroll",sonda);window.addEventListener("resize",sonda);sonda();
document.getElementById("seritBtn").addEventListener("click",function(){document.body.classList.toggle("menu-acik");this.textContent=document.body.classList.contains("menu-acik")?"Kapat ✕":"İçindekiler ▾"});
document.getElementById("menu").addEventListener("click",function(e){if(e.target.closest("a")){document.body.classList.remove("menu-acik");document.getElementById("seritBtn").textContent="İçindekiler ▾"}});
document.addEventListener("click",function(e){if(document.body.classList.contains("menu-acik")&&!e.target.closest("nav")&&!e.target.closest("#serit")){document.body.classList.remove("menu-acik");document.getElementById("seritBtn").textContent="İçindekiler ▾"}});
</script>
</body>
</html>
