li madde değilse <b>Not Applicable</b> (geçerli değil) olarak seçilir."], "ornek": "Ürün kodu gizlendi.", "anahtar": "safety compliance uyum mense origin tehlikeli madde dangerous goods batarya"}, {"baslik": "Gönderin", "metin": ["Bütün zorunlu alanlar dolunca soldaki <b>Submit</b>'e (gönder) basın (1).", "Yarıda bırakmak için <b>Save as draft</b> (taslak olarak kaydet) kullanılır."], "gorsel": "urun-6-gonder.jpg", "ipucu": null, "anahtar": "submit gonder save as draft taslak", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir.", "uyari": "Bu adımı yapmadan önce WhatsApp grubundan Export Partners'a yazabilirsiniz."}]}, {"id": "varyasyon", "baslik": "Varyasyon (renk, beden) ekleme", "ozet": "Aynı ürünün renk ya da beden seçeneklerini tek ilan altında toplama.", "adimlar": [{"baslik": "Varyasyonu açın", "metin": ["Ürün formunda <b>This product has variations</b> düğmesini açın (1)."], "gorsel": "var-1-ac.jpg", "ipucu": null, "anahtar": "variations varyasyon ac renk beden", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Ana ürün kodunu yazın", "metin": ["<b>Parent SKU</b> (ürün ailesinin ortak kodu) kutusuna kodu yazın (1)."], "gorsel": "var-2-tema.jpg", "anahtar": "parent sku ana kod", "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir.", "dogrulandi": true}, {"baslik": "Varyasyon türü kutusunu açın", "metin": ["<b>Variation Theme</b> (varyasyon türü) kutusuna basın (2)."], "gorsel": "var-2-tema.jpg", "anahtar": "variation theme tur", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Varyasyon türünü seçin", "metin": ["Açılan listeden uygun olanı seçin; örnekte <b>Color</b> (renk) seçildi (1). Seçimden sonra altındaki <b>Confirm</b>'e (onayla) basın."], "gorsel": "var-3-renk-sec.jpg", "ipucu": null, "anahtar": "color renk tema secimi", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Seçenekleri ekleyin", "metin": ["<b>Add variation options</b> kısmındaki <b>Add</b>'e basın (1)."], "gorsel": "var-4-ekle.jpg", "ipucu": null, "anahtar": "add variation options secenek ekle", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Seçenek bilgilerini yazın", "metin": ["<b>Color Map</b> (1): Amazon'un hazır renk listesinden en yakın renk; alıcı filtrelemesi buna göre yapılır. <b>Color</b>: sizin ürün için kullandığınız renk adı. Her renk için iki kutuyu doldurup <b>Add</b>'e (ekle) basın."], "gorsel": "var-5-deger.jpg", "anahtar": "color map color renk", "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir.", "dogrulandi": true}, {"baslik": "Seçenekleri kaydedin", "metin": ["Bütün seçenekler girilince <b>Done</b>'a (tamam) basın (2)."], "gorsel": "var-5-deger.jpg", "anahtar": "done tamam", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Her varyasyonun ayrıntısını açın", "metin": ["Listede her varyasyon ayrı satırdır. Ayrıntısı eksik olanın yanındaki <b>Add details</b>'e (ayrıntı ekle) basın (1)."], "gorsel": "var-6-kartlar.jpg", "ipucu": null, "anahtar": "add details manage variants", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Varyasyonun barkodunu girin", "metin": ["<b>External Product ID</b> (ürün barkodu) kısmına o varyasyonun barkodunu girin (1)."], "gorsel": "var-7-detay.jpg", "anahtar": "barkod varyasyon", "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir.", "dogrulandi": true}, {"baslik": "Varyasyonun görsellerini yükleyin", "metin": ["<b>Upload images</b> ile o varyasyonun görsellerini yükleyin (2)."], "gorsel": "var-7-detay.jpg", "anahtar": "gorsel varyasyon", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Kaydedip sıradakine geçin", "metin": ["<b>Save & Next</b>'e (kaydet ve sonraki) basın (3)."], "gorsel": "var-7-detay.jpg", "anahtar": "save next kaydet", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir."}, {"baslik": "Varyasyonun fiyatını girin", "metin": ["Her varyasyonun satırında fiyat ve gönderim yöntemi ayrı girilir; ayrıntısı <b>Yeni ürün ekleme</b> bölümündeki <b>Offer</b> adımında."], "anahtar": "varyasyon fiyat offer", "dogrulandi": true}, {"baslik": "Gönderin", "metin": ["Bütün varyasyonlar tamamlanınca <b>Submit</b>'e basın (1)."], "gorsel": "var-8-gonder.jpg", "ipucu": null, "anahtar": "submit varyasyon gonder", "dogrulandi": true, "ornek": "Örnek ekran: sizin mağazanızda ürün adları ve alanlar farklı görünebilir.", "uyari": "Bu adımı yapmadan önce WhatsApp grubundan Export Partners'a yazabilirsiniz."}], "no": 6}, {"id": "global", "baslik": "Ürünü başka ülkelere açma", "ozet": "Kanada, Meksika ve diğer Amazon pazarlarında ilanı açma (Build International Listings).", "adimlar": [{"baslik": "Başka pazarlarda satış ayarını görün", "gorsel": "global-1.jpg", "dogrulandi": true, "metin": ["Ürünün düzenleme sayfasında soldaki <b>Offer</b>'a (teklif) basın (1).", "<b>Sell In Other Marketplaces</b> (başka pazarlarda sat) anahtarı (2) açıksa ürün diğer Amazon mağazalarında da listelenebilir. Ürün sayfası o ülkede yoksa Amazon içeriği o ülkenin diline kendisi çevirmeye çalışır."], "ornek": "Fiyat ve ürün kodu gizlendi.", "anahtar": "global kanada meksika brezilya sell in other marketplaces uluslararası"}, {"baslik": "Ülke satırlarını okuyun", "gorsel": "global-2.jpg", "dogrulandi": true, "metin": ["Her ülke ayrı satırdır. Kanada satırında (1) o ülkedeki fiyat ve durum görünür; <b>Out of stock</b> (stokta yok), o ülkede satılabilir stok olmadığını gösterir.", "Meksika satırında (2) Amazon ilanı uyum kısıtları yüzünden kendisi açamadığını yazıyor; orada ilan, <b>Add a Product</b> ile yerel dilde ayrıca açılır. Brezilya'da <b>Sell</b> (sat) düğmesi (3) görünür."], "uyari": "Başka bir ülkede satışa açmadan önce WhatsApp grubundan Export Partners'a yazabilirsiniz; ülkeye göre vergi, kayıt ve ürün kısıtları ayrıca değerlendirilir.", "ornek": "Fiyatlar gizlendi.", "anahtar": "out of stock kanada meksika add a product brezilya"}, {"baslik": "Kanada'da \"Verify identity\" uyarısı", "dogrulandi": true, "metin": ["Kullanıcı yetkileri ekranında Kanada ya da Brezilya satırında <b>Verify identity</b> (kimliği doğrula) görünebilir. Bu, o ülkeler için istenen ayrı bir doğrulamadır; ABD'deki satış ve reklam için gerekmez."], "anahtar": "verify identity kimlik doğrulama kanada brezilya yetki"}], "no": 7}, {"id": "siparis", "no": 8, "baslik": "Siparişler ve iadeler", "ozet": "Gelen siparişleri görme, iade talepleri.", "adimlar": [{"baslik": "Siparişleri açın", "metin": ["Üst menüde <b>Manage orders</b>'a (siparişler) basın (1).", "Ürünler Amazon deposundan gönderildiği için siparişler <b>Fulfilled by Amazon</b> sekmesinde görünür (2). Paketleme ve kargo Amazon'dadır; satıcının bir şey göndermesi gerekmez.", "Ekran ilk açıldığında yalnız gönderilmemiş siparişler süzülür ve <b>No results</b> (sonuç yok) görünebilir. Gönderilmiş siparişler için <b>Shipped</b>'e (gönderildi) basın."], "gorsel": "siparis-1.jpg", "anahtar": "manage orders siparis fulfilled by amazon fba", "dogrulandi": true}, {"baslik": "İade talepleri", "metin": ["İadeler üst menüdeki <b>Manage returns</b> sayfasında görünür. Amazon deposundan satılan ürünlerde iadeyi Amazon teslim alır."], "anahtar": "manage returns iade", "dogrulandi": true}]}, {"id": "reklam", "no": 9, "baslik": "Reklam: terimler, eşleşme türleri, anahtar kelime analizi", "ozet": "Reklam ekranındaki her sütunun anlamı, bütçe ve teklif, otomatik ve manuel hedefleme, negatif kelime ve arama terimi raporu.", "adimlar": [{"baslik": "Reklam ekranındaki sütunlar ne anlatır", "metin": ["<b>Impressions</b>: reklamın kaç kez gösterildiği.<br><b>Clicks</b>: kaç kez tıklandığı.<br><b>CTR</b>: tıklama oranı (tıklama ÷ gösterim).<br><b>CPC</b>: tıklama başına ödenen ortalama tutar.<br><b>Spend</b>: harcama.<br><b>Orders / Sales</b>: reklamdan gelen sipariş ve satış tutarı.<br><b>ACoS</b>: harcamanın satışa oranı (harcama ÷ satış). Genellikle düşük olması tercih edilir.<br><b>ROAS</b>: her 1 dolar reklamın getirdiği satış (satış ÷ harcama)."], "gorsel": null, "ipucu": null, "anahtar": "impressions clicks ctr cpc spend acos roas siparis satis gosterim tiklama", "dogrulandi": true}, {"baslik": "Bütçe ve teklif", "metin": ["<b>Daily budget</b> (günlük bütçe): kampanyanın günlük ortalama bütçesi. Ay boyunca ortalanır; yoğun günlerde bu tutar aşılabilir, ama ay toplamı günlük bütçe çarpı gün sayısını geçmez.", "<b>Bid</b> (teklif): bir tıklama için ödenmeye razı olunan en yüksek tutar. Ödenen tutar açık artırmada belirlenir; <b>down only</b> ayarında tekliften fazla olmaz.", "<b>Dynamic bids - down only</b> (dinamik teklif, yalnız düşürme): satış ihtimali düşük görünen aramalarda Amazon teklifi kendisi düşürür, hiç yükseltmez."], "gorsel": null, "anahtar": "daily budget gunluk butce bid teklif dynamic bids down only", "dogrulandi": true, "uyari": "Bütçe ya da teklifi değiştirmeden önce WhatsApp grubundan Export Partners'a yazabilirsiniz; bu ayarlar harcamayı doğrudan değiştirir."}, {"baslik": "Otomatik reklamda dört hedefleme", "metin": ["Otomatik (Auto) kampanyada Amazon reklamı dört yoldan gösterir:", "<b>Close match</b>: ürünle çok yakından ilgili aramalar.<br><b>Loose match</b>: daha geniş, gevşek ilgili aramalar.<br><b>Substitutes</b>: benzer, rakip ürünlerin sayfaları.<br><b>Complements</b>: birlikte alınan, tamamlayıcı ürünlerin sayfaları."], "gorsel": null, "ipucu": "Her birine ayrı teklif verilebilir. Teklif kararı size aittir; ayrıntı için Export Partners'a yazabilirsiniz.", "anahtar": "auto otomatik close match loos function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var menu="<h4>BÖLÜMLER</h4>",ic="",idx=[];
V.bolumler.forEach(function(b){

 ic+='<section class="bolum" id="'+b.id+'"><h2><small>BÖLÜM '+b.no+' / '+V.bolumler.length+'</small><b>'+b.no+'</b>'+esc(b.baslik)+'</h2><p class="ozet">'+esc(b.ozet)+'</p>'+(b.giris?'<p class="ipucu">'+esc(b.giris)+'</p>':'');
 if(!hazir) ic+='<p class="yakinda">Bu bölüm hazırlanıyor.</p>';
 var onceki=null;
 b.adimlar.forEach(function(a,i){
  var aid=b.id+"-"+(i+1), gor=(a.gorsel&&a.gorsel!==onceki)?a.gorsel:null; onceki=a.gorsel||onceki;
  ic+='<div class="adim" id="'+aid+'"><h3><span>'+(i+1)+'</span>'+esc(a.baslik)+'</h3>'+(a.uyari?'<div class="uyari">'+esc(a.uyari)+'</div>':'')+(a.metin||[]).map(function(p){return"<p>"+p+"</p>"}).join("")+
   (a.gorsel&&!gor?'<div class="ornek">İşaretler yukarıdaki görselde.</div>':'')+(gor?'<img loading="lazy" src="img/'+gor+'" alt="'+esc(a.baslik)+'">'+(a.ornek?'<div class="ornek">'+esc(a.ornek)+'</div>':''):"")+(a.ipucu?'<div class="ipucu">'+a.ipucu+'</div>':"")+'</div>';
  idx.push({id:aid,b:b.baslik,t:a.baslik,m:norm(b.baslik+" "+a.baslik+" "+(a.metin||[]).join(" ")+" "+(a.ipucu||"")+" "+(a.anahtar||"")).replace(/<[^>]+>/g," ")});

 var k=q.split(/\s+/),r=idx.filter(function(x){return k.every(function(w){return x.m.indexOf(w)>=0})});
 son.style.display="block";
